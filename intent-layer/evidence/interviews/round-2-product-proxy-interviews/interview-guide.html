<script>
const GUIDES = [{"id": "mv", "short": "Model validation", "title": "Coverage Intent Model Validation", "code": "INT-COV-MV-001", "file": "coverage-intent-model-validation-proxy-interview.md", "qprefix": "MV", "blurb": "Tests whether the four-job-family Coverage model is the right summary of how Coverage works. Episode first, then try to break every statement.", "cohort": "Coverage \u00b7 whole model", "md": "# Coverage Intent Model Validation - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-MV-001` |\n| **Question range** | MV00-MV11 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers (Line MD or Group Head level), former Coverage VPs who ran a senior's book, and product proxies with direct Coverage exposure |\n| **Focused validation audience** | At least two current Senior Coverage MDs who did not take part in Round 1, plus one product banker, after proxy synthesis |\n| **Purpose** | Test whether the existing four-job-family Coverage intent model is the right summary of how Coverage operates and thinks, and whether it is framed around value, before current-banker time is spent. This guide validates what exists. It does not set new direction and does not produce new JTBDs. |\n| **Existing foundation** | Five JTBD statements (intelligence triage, client relationship management, opportunity pipeline stewardship, consequential client meetings, umbrella), one working hypothesis (actions and commitments), four business use cases with six steps each, fourteen scenarios, and two actor cohorts. All derived from one Senior Coverage MD, Q01 to Q151. Every statement in the pre-read pack is a hypothesis for this interview, whatever its catalogue maturity. |\n| **What this guide is not** | Not a discovery interview, not a market-intelligence direction interview, not a prototype review. If a respondent starts describing tools, bring them back to the work. |\n\n## Interviewer Guidance\n\n- Send the pre-read pack (Appendix A) at least 48 hours ahead. Ask respondents to mark it up before the session.\n- Ask MV00, the episode, first and in full before showing any statement. Do not let the model shape the story.\n- Ask respondents to label every answer as direct experience, observed practice, or informed hypothesis, and to say which year they were last active in the role.\n- Seek disconfirmation. For every statement ask what is wrong before asking what is right. \"Accurate as written\" is an acceptable answer only after the respondent has tried to break it.\n- Force ranking and single choices. Do not accept \"all of the above\". If a respondent cannot choose, record that as a finding about the list, not as an answer.\n- Do not defend or re-explain the model when it is challenged. Record the challenge verbatim.\n- Capture disagreement between respondents. Do not resolve it through facilitator inference.\n- Proxy responses can reject, edit or fail to break a statement. They cannot confirm it. Confirmation requires current bankers under the charter's two-participant rule.\n\n## Expected Validation Output\n\nThe proxy round should produce, for the Coverage model as it stands:\n\n1. A disposition for each of the five JTBD statements: survives unchallenged, needs edit (with the edit), wrong altitude, or not recognised.\n2. A verdict on each job family boundary, naming any pair that collides in practice.\n3. Any standing senior job the five job families miss, with an example of that work.\n4. A verdict on the actions and commitments job family: standing job family, execution layer, both, or neither.\n5. Each job family's scenarios ranked by frequency and by consequence, plus missing scenarios and any scenario that is really a different use case.\n6. The actor split per job family: what is irreducibly MD work, what is team work, what is product-partner work.\n7. At least one concrete episode per respondent, mapped onto the model, with the points where the model fails to describe what happened.\n8. Observed current practice per job family, separate from desired practice.\n9. Value ranges in units for each of the four business outcomes.\n10. A language verdict: which words a banker would not use, with substitutions.\n11. No more than five focused questions for current bankers, including at least one episode request.\n\n## MV00 - The Episode First\n\n**Question:** Think of a recent consequential situation from your time in Coverage. A signal you acted on or missed, a relationship that needed senior attention, an opportunity that was lost, parked or won late, or a meeting that changed something. Walk me through it from the moment it first became visible to the point where it was resolved or went quiet.\n\n**Response mode:** Open narrative, ten to fifteen minutes, before any statement is shown. Interviewer records the timeline, the people, the artefacts and the decisions.\n\n**Probes:**\n\n- How did it first become visible, and to whom?\n- What did you rely on at each step: a tracker, email, a call, a meeting, memory, a system?\n- Who owned the next move at each step, and did they know they owned it?\n- Where did the chain break, slow down or recover?\n- What was the consequence for the client, the relationship, the franchise or the revenue?\n- What would have had to be visible earlier to change the outcome?\n- Was anything deliberately not done, and was that the right call?\n\n## MV01 - Map The Episode Onto The Model\n\n**Question:** Now look at the pre-read pack. Which of the five job families did your episode pass through, in what order, and where does the model describe what happened well, poorly, or not at all?\n\n**Response mode:** Tag each job family touched (intelligence, relationships, pipeline, meetings, actions and commitments). For the job family where the episode spent most time, walk the six use-case steps and mark each as happened as described, happened differently, or did not happen.\n\n**Possible answers for each step:**\n\n- **Happened as described** - The step occurred in substance, whatever the tooling.\n- **Happened differently** - Describe the difference in who, what evidence, or what judgment.\n- **Did not happen** - And say whether its absence mattered.\n- **Happened but belongs to a different job family** - Say which.\n\n## MV02 - Test Each Job Statement\n\n**Question:** For each of the five job statements in the pre-read pack, try to break it. Then choose one disposition per statement.\n\n**Response mode:** One disposition per statement, with a reason. Where the disposition is an edit, give the edited wording.\n\n**Possible answers:**\n\n- **Survives** - You tried to break it and could not. Say what you tried.\n- **Right job, wrong wording** - Give the words you would change and why.\n- **Right wording, wrong altitude** - Too detailed, too abstract, or too system-shaped. Say which.\n- **Missing or wrong trade-off** - The \"without\" clause does not match what senior Coverage actually guards against.\n- **Not a job I recognise** - Senior Coverage does not do this as a distinct job. Say where the work actually sits.\n- **Two jobs in one** - Say where it splits.\n\n## MV03 - Job Family Boundaries\n\n**Question:** The model keeps five job families distinct and routes any situation that touches several to the accountable owner. In your experience, which pairs collide so often that the boundary is a fiction, and which boundary is drawn in the wrong place?\n\n**Response mode:** Rank up to two collisions. For each, say what work falls between the job families today.\n\n**Possible answers:**\n\n- Intelligence and relationships: interpreting a signal and deciding to engage are one act.\n- Relationships and meetings: the enduring relationship job and the fixed-window meeting job are not separable.\n- Pipeline and actions: opportunity trajectory and follow-through are the same thing in practice.\n- Meetings and actions: the meeting is not over until follow-through is done, so they are one job.\n- Intelligence and pipeline: most signals are opportunity signals, so triage is pipeline work.\n- Umbrella and everything: the umbrella statement is where the real job lives and the job families are artificial.\n- The boundaries hold.\n- Another collision.\n\n## MV04 - The Missing Job\n\n**Question:** Think about the senior Coverage work you did in a typical quarter. What did you spend material time on that none of the five job families describes?\n\n**Response mode:** Name the work first, with an example. Then say whether it deserves a distinct job, is context inside a job family, or is a triggered guardrail.\n\n**Possible answers:**\n\n- Franchise and sector strategy: portfolio and competitive positioning.\n- People leadership: staffing, coaching, team health.\n- Risk and controls as standing work rather than triggered.\n- Internal stakeholder management beyond orchestrating the bank around a client.\n- Commercial performance: revenue, wallet, outlook beyond pipeline.\n- Capacity: allocating scarce team and specialist time.\n- Nothing material is missing.\n- Another job.\n\n## MV05 - Actions And Commitments\n\n**Question:** Every job family in the model hands its output to an \"actions and commitments\" job family that is only a working hypothesis. In practice, who owns follow-through once a senior has decided, and does that work deserve its own standing senior review?\n\n**Response mode:** Choose one architecture and name the real owner of follow-through in your experience.\n\n**Possible answers:**\n\n- **A standing job family** - Seniors review consequential commitments and blockers across all domains as a distinct job.\n- **An execution layer beneath each job family** - Follow-through belongs to whichever job family generated it; there is no separate senior job.\n- **Both** - Each job family owns its actions and a senior view exposes cross-domain commitments and blockers.\n- **An exception view only** - Follow-through surfaces to the senior only when impact, timing or blockage crosses a threshold.\n- **It should not exist as a job family** - The accountable owner's own job family is the destination; \"actions\" is a tooling idea, not a job.\n- Another model.\n\n## MV06 - Scenario Ranking\n\n**Question:** For each job family, rank its scenarios by how often they occurred in your experience and by how much was at stake when they did. Then name one scenario that is missing and one scenario that is really a different piece of work.\n\n**Response mode:** Two rankings per job family (frequency, consequence). One missing scenario per job family or \"none\". One misfiled scenario per job family or \"none\".\n\n**Scenarios to rank:**\n\n- Intelligence: short-window consequential signal (A), uncertain high-impact signal (B), deliberate non-action or monitoring (C).\n- Relationships: institution relationship review (A), time-sensitive risk or commitment (B), tier-based cadence review (C).\n- Pipeline: recurring pipeline session (A), material change or closing window (B), parked reactivation (C), ambiguous early idea (D), restricted cross-GIB opportunity (E).\n- Meetings: forming client decision (A), relationship-sensitive listening or repair (B), major commitment or cross-JPM meeting (C).\n\n**Probe:** Does any scenario produce something different from its parent use case's value delivered? If so it is a use case, not a scenario. Say which.\n\n## MV07 - The Actor Split\n\n**Question:** For each job family, what is irreducibly the MD's own work, what does the VP or team do, and what do product or regional partners do? The model leaves every contributor role marked as unvalidated.\n\n**Response mode:** Per job family, three short lists. Then answer the probe.\n\n**Possible MD-only work (choose the ones that are truly irreducible):**\n\n- Judging whether something matters in context.\n- Judging whether evidence is credible enough for the contemplated use.\n- Choosing the intended client outcome.\n- Deciding whether and how to use relationship capital.\n- Orchestrating the bank around the institution and resolving ownership.\n- Setting and enforcing the senior-ready bar.\n- Deciding to reshape, park or stop.\n- Deciding to do nothing.\n\n**Probe:** In your experience, which of these did a strong VP actually do without the MD, and did that work?\n\n## MV08 - How It Is Actually Done Today\n\n**Question:** Leaving aside how it should work, how was each job family's work actually done when you were last in the role? What held the state, who kept it current, and which parts of the model's six steps simply never happened?\n\n**Response mode:** Per job family, name the artefacts and the keeper. Label every answer observed practice or direct experience. Hypotheses are not accepted for this question.\n\n**Possible state holders:**\n\n- CRM or deal system of record.\n- Personal or team tracker (spreadsheet, document).\n- Email and calendar.\n- Meeting notes, where they existed.\n- Pitch and deal materials.\n- Junior banker memory.\n- MD memory.\n- Nowhere; it was reconstructed on demand.\n\n**Probes:** How much senior time went into reconstruction before a review? Which step in the model would have felt like administration rather than work?\n\n## MV09 - Value In Units\n\n**Question:** The model's four business outcomes have no baselines. From your experience, give a range for each of the following. A wide range is fine. A refusal to estimate is recorded as a finding.\n\n**Response mode:** Ranges with the experience label. One line each.\n\n**Measures:**\n\n- Senior hours per week spent reconstructing status, context or evidence rather than exercising judgment.\n- Consequential client or market events per quarter that reached you after the useful response window had passed.\n- Share of the reported pipeline you believed was stale or not credible at any given review.\n- Priority client institutions per year that went a quarter without purposeful senior contact.\n- Viable ideas per year that were never recognised as opportunities until a competitor or the client made them visible.\n- What one missed window cost, in whatever unit you would have used at the time: fee, mandate, relationship standing, or senior credibility.\n- Consequential meetings per quarter that produced no owned follow-through within a week.\n\n## MV10 - Language\n\n**Question:** Read the five job statements and one business use case aloud as if to a peer. Which words would a senior Coverage banker not use, and what would they say instead?\n\n**Response mode:** List each word or phrase and the substitute. Then rate the overall readability.\n\n**Candidate terms to test:** intelligence, disposition, destination job family, stewardship, evidential strength, purposeful next movement, accepted judgment, consequential, orchestrate, umbrella intent, value delivered.\n\n**Possible readability verdicts:**\n\n- A banker would read this and recognise their work.\n- A banker would recognise the work but not the words.\n- A banker would stop reading.\n\n## MV11 - The Model As A Litmus Test\n\n**Question:** This model is meant to be the test a product team must pass to show it adds value to Coverage. What would make it useless for that purpose, and how could a team claim alignment to it without actually adding value?\n\n**Response mode:** Open answer, then rank the strongest two failure modes.\n\n**Possible failure modes:**\n\n- Statements are broad enough that anything can claim to serve them.\n- No outcome has a number, so nothing can be shown to move.\n- The model describes desired progress, so a team can serve the aspiration while making the real work harder.\n- Non-action is a valid result, so a team can claim value from a product nobody uses.\n- The model reflects one MD, so a team can pick the parts that suit it.\n- The language is abstract enough that bankers will not challenge a claim made in it.\n- The missing actions job family lets any follow-through tooling claim alignment by default.\n- Another failure mode.\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, produce:\n\n- one disposition per JTBD statement, with every proposed edit preserved verbatim and attributed to the respondent's experience label;\n- the job-family-boundary and missing-job findings, with examples;\n- the actions and commitments verdict;\n- scenario rankings by job family, missing scenarios, and any scenario proposed for promotion to a use case;\n- the actor split per job family;\n- every episode mapped onto the model, with the points where the model failed to describe it;\n- observed current practice per job family, kept separate from desired practice;\n- value ranges per outcome, with experience labels;\n- the language substitutions; and\n- no more than five focused questions for current bankers, including at least one episode request.\n\nCatalogue consequences. Any record a proxy rejected or materially edited is marked `Review required` under the generation guide's re-review procedure. No record is promoted on proxy evidence. The five JTBD statements remain evidence-backed, single participant until two current Senior Coverage MDs who did not draft them have been through the banker question set.\n\nCurrent bankers should be asked to break what the proxies could not, supply one episode each, and give value ranges. They should not be asked to repeat the full guide.\n\n## Appendix A - Pre-Read Pack\n\nSend this to respondents ahead of the session. Everything here is a hypothesis for the purposes of the interview.\n\n### The five job statements\n\n**Intelligence triage.** When new information may affect my clients or franchise, help me isolate consequential change, understand its client-specific implications and evidential strength, and choose the appropriate response and intended outcome, so we act early when it matters, confidently do nothing when it does not, and avoid surprises without consuming senior attention on noise.\n\n**Client relationship management.** When managing a priority client institution, help me judge and strengthen the quality of the relationship using meaningful markers of trust, access, reciprocity, and engagement, informed by what we understand of the client's evolving agenda, so JPM remains relevant, trusted, and positioned to influence and compete.\n\n**Opportunity pipeline management.** When managing opportunities from idea through close, help me maintain disciplined stewardship through clear accountability, purposeful movement, regular challenge, and deliberate parking or exit, so the franchise can direct effort and protect its outlook without losing viable opportunities or creating administrative burden, even when client intent is ambiguous and judgments differ.\n\n**High-stakes client meetings.** When a consequential client interaction creates a fixed window to learn or influence, help me enter with a grounded hypothesis, timely context, aligned JPM posture, and critical uncertainty resolved, so the meeting clarifies intent, strengthens trust, and advances, protects, or deliberately defers a decision, with the changed state carried into owned follow-through.\n\n**Umbrella.** When client and franchise conditions are changing, help me judge what is consequential in context and maintain momentum toward the outcomes that matter, so JPM responds coherently while there is still time to influence the result, without confusing activity with progress.\n\n**Working hypothesis, actions and commitments.** When consequential outcomes depend on coordinated work, help me translate intent into an accepted owner and explicit next commitment, and keep that commitment connected to visible outcome progress, so responsibilities resolve clearly and owners can move independently without work drifting or repeatedly returning to me.\n\n### The job family boundaries\n\n- Intelligence decides how consequential evidence should be interpreted and routed.\n- Relationships judge and strengthen institution-level relationship quality.\n- Pipeline governs disciplined opportunity stewardship from idea through close.\n- Actions and commitments translate intent into accepted ownership, explicit next commitments, and visible outcome progress.\n- Meetings prepare for and convert fixed client-interaction windows into interpreted, routed, and initiated progress.\n- Capacity is deferred. Risk and controls appear only when triggered.\n- When a situation touches several job families, the accountable owner's job family leads and the others are linked.\n\n### The six steps of each business use case\n\n| Job family | Steps |\n| --- | --- |\n| Intelligence | Reduce noise; identify affected clients and context; explain consequence and evidence; judge the response; record the disposition; route to the destination job family. |\n| Relationships | Establish institution change and trajectory; interpret relationship markers; judge whether senior attention is warranted; set objective and stakeholder; choose the engagement disposition; review movement and update judgment. |\n| Pipeline | Recognise an opportunity or review trigger; assemble evidence and views; challenge maturity and trajectory; choose the stewardship response; confirm accountable stewardship and next movement; update the shared picture and review conditions. |\n| Meetings | Establish why this interaction matters now; form the hypothesis and intended outcome; align JPM posture and resolve critical uncertainty; engage and adapt; interpret the outcome; make commitments explicit, update job families, initiate follow-through. |\n\n### The fourteen scenarios\n\nIntelligence A short-window signal, B uncertain high-impact signal, C deliberate non-action. Relationships A institution review, B time-sensitive risk or commitment, C tier-based cadence. Pipeline A recurring session, B material change or closing window, C parked reactivation, D ambiguous early idea, E restricted cross-GIB. Meetings A forming client decision, B listening or repair, C major commitment or cross-JPM.\n\n### The actor split as currently recorded\n\nSenior Coverage MD: judges materiality, credibility, response, intended client outcome, relationship quality, senior attention, pursuit, effort, reshape or stop. Coverage opportunity team: maintains evidence, stewards opportunities, executes next movement. All other contributor roles: unvalidated.\n"}, {"id": "int", "short": "Intelligence job family", "title": "Coverage Consequential Intelligence", "code": "INT-COV-INT-001", "file": "coverage-consequential-intelligence-proxy-interview.md", "qprefix": "CINT", "blurb": "Validates the triage boundary, ownership, routing and success tests for consequential intelligence from any source.", "cohort": "Coverage \u00b7 INTEL", "md": "# Coverage Consequential Intelligence - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-INT-001` |\n| **Question range** | CINT01-CINT12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and intelligence, research, product, and information-flow SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Validate the direction, process boundary, ownership, routing, and success tests for consequential intelligence without asking current bankers to repeat the original discovery. |\n| **Existing foundation** | The Q91 JTBD is confirmed for Coverage: isolate consequential change, understand client-specific implications and evidential strength, then choose the response and intended outcome. The supporting process and contributor roles remain evidence-backed and revisable. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label each answer as direct experience, observed practice, or informed hypothesis.\n- Seek the strongest choices rather than accepting every plausible answer.\n- Treat this as broader consequential intelligence from any source. Use the separate Market Intelligence interview for market-specific domains and production.\n- Preserve disagreement about source, ownership, and thresholds for focused banker validation.\n- Proxy responses establish candidate direction only. They do not reconfirm the JTBD or prove capability support.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. The primary progress and scope of consequential intelligence.\n2. Materiality, context, evidence, and uncertainty tests.\n3. A candidate preparatory-triage and senior-judgment boundary.\n4. A disposition and destination-routing model.\n5. Ownership, sensitivity, and feedback-loop requirements.\n6. Leading measures, lagging outcomes, and failure guardrails.\n7. A short current-banker validation set centered on disputed thresholds and a real episode.\n\n## CINT01 - Primary Progress\n\n**Question:** What should excellent intelligence triage enable a Senior Coverage MD to do more reliably than today?\n\n**Response mode:** Select and rank up to three primary outcomes; classify the remainder as enablers or downstream benefits.\n\n**Possible answers:**\n\n- Isolate consequential change from noise.\n- Understand which clients or franchise outcomes may be affected.\n- Judge evidential strength without false certainty.\n- Recognize a useful intervention window earlier.\n- Choose an appropriate response and intended client outcome.\n- Confidently decide not to act when evidence does not justify it.\n- Avoid consequential surprises.\n- Reduce senior time spent finding and validating information.\n- Another outcome.\n\n## CINT02 - Intelligence Scope\n\n**Question:** Which information belongs in the consequential-intelligence job, and which should stay in specialist or destination-job-family workflows?\n\n**Response mode:** Rank the primary source classes; mark the remainder secondary, on-demand, or out of scope.\n\n**Possible answers:**\n\n- Market, macro, sector, and research developments.\n- Client statements, behavior, and interaction evidence.\n- Relationship changes and stakeholder movement.\n- Opportunity, transaction, and competitive evidence.\n- Product, regional, and cross-JPM activity.\n- Regulatory, policy, legal, and geopolitical developments.\n- Internal commitments, blockers, and execution changes.\n- External news, peer actions, and competitor intelligence.\n- Another source class.\n\n## CINT03 - Materiality And Timing\n\n**Question:** What makes new information consequential enough to enter senior Coverage triage?\n\n**Response mode:** Select and rank the strongest tests; explain whether several must combine.\n\n**Possible answers:**\n\n- Material client or franchise consequence.\n- A short or closing decision window.\n- Relationship sensitivity or trust implications.\n- A meaningful change to an opportunity judgment.\n- Strategic ambiguity requiring senior context.\n- Cross-client, cross-product, or cross-region consequence.\n- Contradiction of the team's accepted view.\n- Costly or difficult-to-reverse delay.\n- Another materiality test.\n\n## CINT04 - Noise And Duplication\n\n**Question:** What should happen before information is treated as a distinct intelligence item rather than repetition, commentary, or background context?\n\n**Response mode:** Select the minimum preprocessing required before contextual assessment.\n\n**Possible answers:**\n\n- Deduplicate equivalent facts or reports.\n- Separate new evidence from repeated commentary.\n- Connect the item to existing knowledge or an active watch condition.\n- Identify what materially changed from the prior understood state.\n- Exclude information with no plausible client or franchise relevance.\n- Preserve multiple sources where corroboration or disagreement matters.\n- Let the relevant owner decide whether apparent duplication is meaningful.\n- Another rule.\n\n## CINT05 - Client And Franchise Translation\n\n**Question:** What context must be added before intelligence is useful for senior Coverage judgment?\n\n**Response mode:** Select the minimum required context and identify what may remain on demand.\n\n**Possible answers:**\n\n- Affected client, stakeholder, opportunity, or franchise scope.\n- Prior client and relationship context.\n- Existing hypothesis or accepted judgment that may change.\n- Potential consequence and remaining response window.\n- Client usability: what could be learned, discussed, protected, or advanced.\n- Relevant ownership, commitments, or dependencies.\n- JPM relevance and credible right to respond.\n- Known restrictions or sensitivity boundaries.\n- Another context element.\n\n## CINT06 - Evidence And Uncertainty\n\n**Question:** What evidence contract should govern potentially important but uncertain intelligence?\n\n**Response mode:** Select the essential trust elements and state how standards change with consequence and time.\n\n**Possible answers:**\n\n- Named source and visible provenance.\n- Timestamp and freshness appropriate to the decision window.\n- Clear distinction between fact, inference, and opinion.\n- Corroboration or explanation of why one source is sufficient.\n- Explicit confidence and missing facts.\n- Alternative interpretations or dissenting evidence.\n- Sensitivity and permitted-use classification.\n- Proportionately greater scrutiny for higher consequence.\n- Use as a question or hypothesis where action would be premature.\n- Another requirement.\n\n## CINT07 - Preparatory Triage Ownership\n\n**Question:** What should VPs, associates, product partners, research, or intelligence contributors complete before direct MD attention is requested?\n\n**Response mode:** Select the minimum preparatory work and identify one accountable preparatory owner or stage-dependent model.\n\n**Possible answers:**\n\n- Reduce noise and duplication.\n- Identify affected clients and existing contexts.\n- Explain the potential consequence and timing.\n- Expose source, evidence, confidence, and uncertainty.\n- Distinguish what is known, inferred, and restricted.\n- Prepare response options or a specific senior question.\n- Identify the current owner and destination if already clear.\n- Escalate immediately where delay is itself consequential.\n- Another preparatory responsibility.\n\n## CINT08 - Irreducible MD Judgment\n\n**Question:** Once preparatory triage is complete, which judgments must remain with the Senior Coverage MD?\n\n**Response mode:** Select the irreducible judgments, not engagement mechanics that can be delegated.\n\n**Possible answers:**\n\n- Whether the information materially matters in context.\n- Whether it is credible enough for the contemplated use.\n- Whether a response is warranted now.\n- What client or franchise outcome should be pursued.\n- Whether an existing relationship or opportunity judgment has changed.\n- Whether personal MD involvement is required.\n- Whether deliberate monitoring or non-action is appropriate.\n- Another senior judgment.\n\n## CINT09 - Disposition And Routing\n\n**Question:** What explicit dispositions should complete intelligence triage, and where should accepted intelligence go next?\n\n**Response mode:** Select all legitimate dispositions, then define their destination or reassessment condition.\n\n**Possible answers:**\n\n- Dismiss as noise with rationale.\n- Retain as context.\n- Monitor for a defined condition.\n- Validate or investigate further.\n- Route to relationship management.\n- Route to opportunity pipeline.\n- Route to meeting preparation.\n- Route to an action, commitment, or accountable owner.\n- Create a temporary cross-family situation.\n- Act directly or prepare engagement.\n- Another disposition or destination.\n\n## CINT10 - Sensitivity And Safe Sharing\n\n**Question:** How should intelligence be coordinated when relevant evidence cannot be shared fully across teams or regions?\n\n**Response mode:** Define the safe minimum, accountable routing, and escalation model.\n\n**Possible answers:**\n\n- Share that a restricted situation exists and identify its owner.\n- Share a permitted consequence or watch condition without source substance.\n- Route evidence only to an entitled destination owner.\n- Ask the source owner to provide a sanitized interpretation.\n- Use legal, compliance, clean-team, or information-barrier review.\n- Suppress cross-linking where even existence is restricted.\n- Preserve an audit trail of access and disposition.\n- Another safe-sharing rule.\n\n## CINT11 - Success And Failure\n\n**Question:** What would prove consequential-intelligence triage is improving senior Coverage work, and what must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails.\n\n**Possible success measures:**\n\n- Earlier identification of relevant change.\n- Faster evidence-to-disposition time.\n- Better client conversations or decisions.\n- Fewer consequential surprises.\n- Less senior time spent on noise and manual verification.\n- More appropriate deliberate non-action.\n- Faster movement in the destination job family.\n\n**Possible failure modes:**\n\n- Alert volume without consequence.\n- Missing client context.\n- False confidence or hidden uncertainty.\n- Duplicated investigation.\n- Late escalation.\n- Restricted-information leakage.\n- Intelligence recorded without an owner, disposition, or destination.\n\n## CINT12 - Representative Episode\n\n**Question:** Describe one recent intelligence item that materially changed, or should have changed, a client or franchise decision. Where did it originate, how was it interpreted, who judged it, and what happened next?\n\n**Response mode:** Use a direct experience where possible; otherwise label the example as observed practice or hypothesis.\n\n**Probes:**\n\n- What was the first clue and when did it become consequential?\n- Which context was missing or had to be reconstructed?\n- What evidence and uncertainty were visible?\n- Who owned preparation, senior judgment, and downstream action?\n- Was the final disposition act, route, monitor, or dismiss?\n- What would have improved the outcome or reduced wasted attention?\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, synthesize the proposed triage contract, preparatory-owner model, senior judgment boundary, disposition set, routing rules, measures, disagreements, and evidence gaps. Current bankers should receive no more than five focused validation questions, including at least one concrete episode and any disputed materiality or trust threshold.\n"}, {"id": "rel", "short": "Relationships job family", "title": "Coverage Relationship Management", "code": "INT-COV-REL-001", "file": "coverage-relationship-management-proxy-interview.md", "qprefix": "CREL", "blurb": "Validates the institution-level boundary, the relationship-quality marker model, orchestration authority and success tests.", "cohort": "Coverage \u00b7 REL", "md": "# Coverage Relationship Management - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-REL-001` |\n| **Question range** | CREL01-CREL12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and client-relationship, sector, regional, and product SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Validate the direction, institution-level boundary, marker model, orchestration authority, and success tests for senior relationship management. |\n| **Existing foundation** | The Q111 JTBD is confirmed for Coverage: judge and strengthen relationship quality through meaningful trust, access, reciprocity, and engagement markers, informed by the evolving client agenda. Supporting process, measures, and contributor roles remain evidence-backed and revisable. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label answers as direct experience, observed practice, or informed hypothesis.\n- Keep the job family at institution-level relationship intent; use the separate Meeting, Pipeline, Actions, and Intelligence interviews for their bounded jobs.\n- Do not turn relationship quality into one opaque score or equate activity volume with strength.\n- Preserve variation by client tier, trajectory, region, sector, and Coverage model.\n- Proxy responses establish candidate direction only. They do not reconfirm banker intent.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. The primary progress and boundary of relationship management.\n2. A candidate set of meaningful relationship-quality markers.\n3. Attention, cadence, stakeholder, and engagement rules.\n4. A Coverage-led orchestration and contributor model.\n5. Deliberate non-action and handoff boundaries.\n6. Measures, guardrails, disagreements, and banker-validation questions.\n\n## CREL01 - Primary Progress\n\n**Question:** What should senior relationship management enable a Coverage MD to create or protect more reliably?\n\n**Response mode:** Select and rank up to three primary outcomes; classify other selected items as enablers or downstream benefits.\n\n**Possible answers:**\n\n- Trusted access to the client institution.\n- Better understanding of the client's evolving agenda.\n- Permission to influence consequential decisions.\n- The right to compete for priority opportunities.\n- Broader and more resilient institutional relevance.\n- Reciprocal and reliable commitments.\n- Coherent JPM engagement across products and regions.\n- Early recognition and repair of relationship risk.\n- Another outcome.\n\n## CREL02 - Unit And Scope\n\n**Question:** What should be the primary unit of relationship judgment, and where should the boundary sit with stakeholder, opportunity, meeting, and action work?\n\n**Response mode:** Choose the primary unit, then classify adjacent work as included context, linked work, or out of scope.\n\n**Possible answers:**\n\n- Client institution.\n- Individual stakeholder.\n- Relationship objective.\n- Connected stakeholder network.\n- Live client situation.\n- Adaptive by client type or objective.\n- Another unit.\n\n**Boundary prompts:** stakeholder engagement, opportunity pursuit, meeting preparation, commitment execution, market or client intelligence, and cross-bank coordination.\n\n## CREL03 - Relationship-Quality Markers\n\n**Question:** Which observable markers best indicate genuine relationship quality rather than contact volume or sentiment alone?\n\n**Response mode:** Rank the five most meaningful markers and identify misleading proxies.\n\n**Possible answers:**\n\n- Candor and willingness to share difficult context.\n- Access to relevant senior decision-makers.\n- Client-initiated requests for JPM perspective.\n- Reciprocal commitments that resolve reliably.\n- JPM influence on client thinking or decisions.\n- Breadth and resilience of stakeholder access.\n- Inclusion in consequential moments.\n- Recovery after setbacks or difficult conversations.\n- Meaningful rather than merely frequent contact.\n- Another marker.\n\n## CREL04 - Understanding The Client Agenda\n\n**Question:** How should Coverage understand the client's evolving agenda without pretending it can be fully documented or reduced to a static model?\n\n**Response mode:** Select the evidence that should inform judgment and identify what must remain a hypothesis.\n\n**Possible answers:**\n\n- Explicit client statements and commitments.\n- Strategic decisions and capital allocation.\n- Leadership, board, ownership, or stakeholder changes.\n- Interaction patterns, questions, and requests for perspective.\n- Market, sector, competitive, and regulatory context.\n- Active opportunities, risks, and dependencies.\n- Product and regional observations across JPM.\n- Coverage hypotheses with visible evidence and uncertainty.\n- Another source.\n\n## CREL05 - Senior Attention Trigger\n\n**Question:** What should cause a relationship issue or opportunity to rise specifically to Senior Coverage MD attention?\n\n**Response mode:** Select and rank the strongest tests; explain how tier and trajectory change them.\n\n**Possible answers:**\n\n- Relationship leverage where MD involvement can alter the result.\n- Material relationship risk or loss of trust.\n- A forming client decision.\n- A significant JPM or client commitment.\n- Need for cross-JPM orchestration.\n- Seniority, protocol, or right-to-engage considerations.\n- A material change in client context or trajectory.\n- A cadence condition for a priority relationship.\n- Another trigger.\n\n## CREL06 - Stakeholder Selection\n\n**Question:** For a specific relationship objective, what should determine which client stakeholder and JPM participants are involved?\n\n**Response mode:** Select the governing tests and identify who resolves conflicts.\n\n**Possible answers:**\n\n- Ability to shape the intended client outcome.\n- Possession of relevant context or authority.\n- Relationship quality or risk requiring attention.\n- Ability to broaden access or institutional relevance.\n- Connection to a material commitment.\n- Credible JPM right to engage.\n- MD presence materially changes the result.\n- Need to rebalance an over-concentrated stakeholder portfolio.\n- Protocol, sensitivity, or regional constraints.\n- Another test.\n\n## CREL07 - Purposeful Engagement\n\n**Question:** What must be clear before senior relationship engagement is warranted?\n\n**Response mode:** Select the minimum engagement thesis and identify what may remain on demand.\n\n**Possible answers:**\n\n- What changed and why the moment matters.\n- What matters to the stakeholder or institution.\n- The intended learning, influence, repair, or commitment outcome.\n- Why JPM has a credible right to engage.\n- What perspective, question, or message to bring.\n- What must be avoided or treated sensitively.\n- Desired JPM participants and posture.\n- What should happen next if the interaction succeeds.\n- Another element.\n\n## CREL08 - Institution-Level Orchestration\n\n**Question:** How should Coverage orchestrate one coherent institution relationship across product, regional, and specialist teams?\n\n**Response mode:** Choose the closest accountability model and explain conflict resolution.\n\n**Possible answers:**\n\n- Coverage MD owns institution-level coherence and coordinates contributors.\n- Best-positioned banker leads each situation under a Coverage framework.\n- Shared senior ownership with one named coordinator.\n- Ownership varies by product, geography, or client objective.\n- Product teams own product agendas while Coverage owns sequencing and client posture.\n- Another model.\n\n**Probes:** duplicate outreach, conflicting positioning, hidden activity, commitment ownership, and escalation to relevant business heads.\n\n## CREL09 - Cadence And Deliberate Non-Action\n\n**Question:** When should cadence trigger review, delegated contact, personal MD engagement, deliberate monitoring, or no action?\n\n**Response mode:** Define the rule by relationship tier and trajectory.\n\n**Possible answers:**\n\n- Cadence triggers review but never contact by itself.\n- Cadence may trigger delegated maintenance.\n- Cadence may warrant personal MD contact for priority relationships.\n- Changed trajectory matters more than elapsed time.\n- A clear purpose and right to engage are always required.\n- Listening or maintaining access can itself be a valid purpose.\n- Deliberate wait is valid with a reassessment condition.\n- Another rule.\n\n## CREL10 - Prepared Case And Ownership\n\n**Question:** What should be assembled before a relationship issue reaches the MD, and what should leave the review with an owner?\n\n**Response mode:** Select the minimum prepared case and completion contract.\n\n**Possible answers:**\n\n- Institution-level change and trajectory.\n- Relationship-quality markers and contradictions.\n- Reason for attention now.\n- Relevant stakeholder implications.\n- Cross-JPM context and planned engagement.\n- Recommended objective and engagement options.\n- Uncertainty, sensitivity, and right-to-engage constraints.\n- Accepted disposition, accountable owner, and next movement.\n- Reassessment condition if waiting.\n- Another element.\n\n## CREL11 - Success And Failure\n\n**Question:** What would prove relationship management is improving the business, and what must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails.\n\n**Possible success measures:**\n\n- Increased candor and useful access.\n- More client-initiated requests for JPM's view.\n- Reciprocal commitments resolving reliably.\n- Earlier recognition and repair of relationship risk.\n- Broader relevant stakeholder access.\n- Greater relevance and right to compete.\n- Coherent cross-JPM engagement.\n\n**Possible failure modes:**\n\n- Treating contact frequency as relationship quality.\n- Opaque scoring without explainable markers.\n- Purposeless or duplicative outreach.\n- Over-contacting the client.\n- Fragmented JPM posture.\n- Missing or unowned commitments.\n- False certainty about the client's agenda.\n\n## CREL12 - Representative Episode\n\n**Question:** Describe a recent relationship episode in which trust, access, relevance, or the right to compete materially improved or deteriorated. What changed, how was it recognized, and what did Coverage do?\n\n**Response mode:** Use a direct experience where possible; otherwise label the example as observed practice or hypothesis.\n\n**Probes:**\n\n- Which markers revealed the change?\n- Which stakeholder and institution context mattered?\n- What was the relationship objective?\n- Who orchestrated JPM and who owned follow-through?\n- Was personal engagement, delegation, coordination, repair, or deliberate wait chosen?\n- What would have improved the outcome?\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, synthesize the relationship-quality marker set, attention and cadence rules, institution-orchestration model, prepared-case contract, measures, disagreements, and evidence gaps. Current bankers should receive no more than five focused validation questions, including one concrete episode and any disputed marker, tier, or authority rule.\n"}, {"id": "pipe", "short": "Pipeline job family", "title": "Coverage Pipeline Stewardship", "code": "INT-COV-PIPE-001", "file": "coverage-pipeline-stewardship-proxy-interview.md", "qprefix": "CPIPE", "blurb": "Validates the lifecycle boundary, evidence contract, accountability and measures for disciplined opportunity stewardship.", "cohort": "Coverage \u00b7 PIPE", "md": "# Coverage Pipeline Stewardship - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-PIPE-001` |\n| **Question range** | CPIPE01-CPIPE12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and pipeline, product, regional, and business-management SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Validate the operating direction, lifecycle boundary, evidence contract, accountability, and measures for disciplined opportunity stewardship. |\n| **Existing foundation** | The Q117 JTBD is confirmed for Senior Coverage MDs. The Idea-to-Closed value stream, six-step process, actor contributions, and scenarios remain evidence-backed. Q139's concrete lost, delayed, parked, or recovered opportunity episode remains the principal gap. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label each answer as direct experience, observed practice, or informed hypothesis.\n- Keep pipeline centered on opportunity stewardship, not detailed task execution or one system's stage model.\n- Preserve legitimate early ambiguity and avoid forcing probability, economics, or one canonical view before evidence supports it.\n- Distinguish Coverage, product, region, client tier, and maturity variations.\n- Proxy responses establish candidate direction only. They do not reconfirm the JTBD or capability support.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. The primary stewardship progress and lifecycle boundary.\n2. An idea-recognition and minimum-evidence contract.\n3. Senior judgment, ownership, and conflict-resolution rules.\n4. Explicit stewardship responses, review forums, and re-entry memory.\n5. Safe coordination rules and selected success measures.\n6. Concrete episodes and a short current-banker validation set.\n\n## CPIPE01 - Primary Progress\n\n**Question:** What should disciplined pipeline stewardship enable a Senior Coverage MD and opportunity team to do more reliably?\n\n**Response mode:** Select and rank up to three primary outcomes; classify the remainder as enablers or downstream benefits.\n\n**Possible answers:**\n\n- Know what is real and current without false precision.\n- Recognize viable ideas earlier.\n- Maintain purposeful client and opportunity movement.\n- Direct franchise effort toward consequential pursuits.\n- Make deliberate portfolio choices.\n- Protect the outlook.\n- Prevent silent opportunity leakage.\n- Establish accountable stewardship.\n- Reduce reconstruction and reporting overhead.\n- Another outcome.\n\n## CPIPE02 - Lifecycle Boundary\n\n**Question:** Where should opportunity stewardship begin and end, and when should work remain in relationship management or move into detailed deal execution?\n\n**Response mode:** Choose the closest lifecycle model and define entry, handoff, parking, and exit conditions.\n\n**Possible answers:**\n\n- One Idea-to-Closed continuum with maturity-specific evidence and decisions.\n- Distinct but linked origination and active-deal jobs.\n- Relationship management until explicit client interest exists.\n- Product-specific boundaries for different transaction types.\n- Adaptive boundary based on evidence, client intent, and execution commitment.\n- Another model.\n\n## CPIPE03 - Idea Recognition Threshold\n\n**Question:** What is the minimum evidence for a plausible idea to enter shared stewardship without filling the portfolio with speculation?\n\n**Response mode:** Select the minimum threshold and identify what may remain qualitative.\n\n**Possible answers:**\n\n- A plausible client need or strategic hypothesis.\n- Relevant intelligence, interaction, or market evidence.\n- Credible JPM role or differentiated contribution.\n- Potential client or franchise value.\n- A named accountable steward.\n- A purposeful next learning or client move.\n- An explicit uncertainty statement.\n- A reason the idea matters now.\n- Another threshold.\n\n## CPIPE04 - Minimum Trusted Evidence And Plural Views\n\n**Question:** What evidence is required at each maturity, and when may several legitimate views coexist?\n\n**Response mode:** Select the core evidence and define how canonical convergence should increase with maturity.\n\n**Possible answers:**\n\n- Client need or strategic hypothesis.\n- Evidence of client intent.\n- Strategic and economic value, qualitative where necessary.\n- Current lifecycle state and trajectory.\n- JPM role and competitive position.\n- Accountable owner and next client outcome.\n- Blockers, dependencies, and decision window.\n- Provenance, freshness, confidence, and sensitivity.\n- Alternative interpretations with named owners.\n- Another evidence element.\n\n## CPIPE05 - Irreducible Senior Judgment\n\n**Question:** Which pipeline judgments genuinely require the Senior Coverage MD rather than routine team administration?\n\n**Response mode:** Select and rank the irreducible judgments.\n\n**Possible answers:**\n\n- Which opportunities merit continued pursuit.\n- What client outcome should be pursued next.\n- Whether the opportunity judgment has changed.\n- Where franchise effort should move.\n- When senior intervention can alter trajectory.\n- When to reshape, monitor, park, reactivate, or stop.\n- How institution-level relationship consequences affect pursuit.\n- Whether conflicting product or regional views require escalation.\n- Another judgment.\n\n## CPIPE06 - Accountability Across GIB\n\n**Question:** How should opportunity ownership and institution-level orchestration work across Coverage, products, regions, and KDMs?\n\n**Response mode:** Choose the closest accountability model and define conflict resolution.\n\n**Possible answers:**\n\n- Coverage owns institution-level coherence; one opportunity owner accepts stewardship.\n- One named opportunity owner leads regardless of organizational boundary.\n- Best-positioned banker leads under a Coverage framework.\n- Shared senior ownership with one coordinator.\n- Ownership changes explicitly with lifecycle stage.\n- Product teams own product pursuits while Coverage owns client posture and sequencing.\n- Another model.\n\n## CPIPE07 - Stewardship Responses And Movement\n\n**Question:** Which explicit responses should follow a challenge-tested opportunity judgment?\n\n**Response mode:** Select all legitimate states and define the minimum next-movement contract.\n\n**Possible answers:**\n\n- Advance toward a clearer client outcome.\n- Reshape the hypothesis, product, team, or engagement path.\n- Continue learning under an explicit condition.\n- Monitor for a defined trigger.\n- Park with re-entry conditions and a watch owner.\n- Reactivate after new evidence.\n- Exit deliberately with a minimal rationale.\n- Escalate ownership or resource conflict.\n- Route detailed commitments into execution or Actions.\n- Another response.\n\n## CPIPE08 - Review Forums And Challenge\n\n**Question:** What should recurring and event-driven pipeline reviews produce, and which decisions belong in which forum?\n\n**Response mode:** Select the legitimate purposes and identify authority, participants, and exit criteria.\n\n**Possible answers:**\n\n- Establish a shared current picture.\n- Challenge maturity, trajectory, and assumptions.\n- Decide pursuit, reshape, park, or exit.\n- Resolve ownership and client-contact conflicts.\n- Direct senior attention or franchise effort.\n- Surface capacity or dependency constraints.\n- Confirm next movement and review condition.\n- Review only materially changed opportunities.\n- Another purpose.\n\n## CPIPE09 - Lost, Parked, And Reactivated Memory\n\n**Question:** What should be retained when an opportunity is lost, declined, or parked so re-entry and learning are possible without permanent clutter?\n\n**Response mode:** Select the minimum closure and reactivation record.\n\n**Possible answers:**\n\n- Outcome or park reason and supporting evidence.\n- Last accepted opportunity judgment.\n- Reactivation conditions or watch signals.\n- Future-watch owner.\n- Client and relationship consequences.\n- Relevant objections or competitive outcome.\n- Minimal lessons for future pursuits.\n- Retention period and sensitivity classification.\n- Another element.\n\n## CPIPE10 - Restricted And Cross-GIB Coordination\n\n**Question:** What minimum pipeline context may be shared when opportunity substance is restricted, and how should relevant evidence reach the accountable owner?\n\n**Response mode:** Define the safe minimum, entitled detail, and escalation path.\n\n**Possible answers:**\n\n- That a restricted situation exists.\n- Accountable owner and permitted routing path.\n- High-level client or franchise consequence.\n- A safe watch condition or do-not-contact instruction.\n- Entitled substance only within the restricted group.\n- Sanitized interpretation from the source owner.\n- Legal, compliance, clean-team, or information-barrier review.\n- No visibility where even existence is restricted.\n- Another rule.\n\n## CPIPE11 - Success And Failure\n\n**Question:** What would prove pipeline stewardship is improving the business, and what must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails.\n\n**Possible success measures:**\n\n- Earlier recognition of viable ideas.\n- Reliable accountable stewardship.\n- More purposeful progression, parking, and exit.\n- Faster recognition of changed trajectory.\n- Improved stage-appropriate portfolio accuracy.\n- Less management reconstruction and reporting effort.\n- Fewer viable opportunities lost without review.\n\n**Possible failure modes:**\n\n- False precision or forced probability.\n- Inflated idea volume without stewardship.\n- Stale stages or optimistic reporting.\n- Nominal ownership.\n- Activity mistaken for client progress.\n- Permanent clutter from weak or parked pursuits.\n- Restricted-information leakage.\n\n## CPIPE12 - Concrete Opportunity Episode\n\n**Question:** Walk through one opportunity that was lost, nearly lost, parked, reactivated, or advanced later than it should have been. How did it first become visible, how was it stewarded, and where did the chain break or recover?\n\n**Response mode:** Prefer a direct experience and label the cohort, product, region, and maturity. Do not infer a case where none is available.\n\n**Probes:**\n\n- What evidence first supported recognition?\n- Which views differed, and when did they converge?\n- Who accepted ownership and the next client outcome?\n- Which review or event changed the trajectory?\n- Were sensitivity, coordination, or resource constraints material?\n- What should have become visible earlier?\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, synthesize the lifecycle, recognition threshold, evidence and convergence contract, senior judgment boundary, accountability model, stewardship states, forum purposes, measures, disagreements, and episode evidence. Current bankers should receive no more than five focused validation questions and at least one real opportunity walkthrough; unresolved absence of a concrete episode must remain explicit.\n"}, {"id": "meet", "short": "Meetings job family", "title": "Coverage High-Stakes Client Meetings", "code": "INT-COV-MEET-001", "file": "coverage-consequential-client-meetings-proxy-interview.md", "qprefix": "CMEET", "blurb": "Validates the consequential-meeting threshold, preparation and completion boundaries, contributor model and success tests.", "cohort": "Coverage \u00b7 MEET", "md": "# Coverage High-Stakes Client Meetings - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-MEET-001` |\n| **Question range** | CMEET01-CMEET12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and client-meeting, relationship, product, and executive-preparation SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Validate the direction, consequential-meeting threshold, preparation and completion boundaries, contributor model, and success tests. |\n| **Existing foundation** | The Q127 JTBD is confirmed for Senior Coverage MDs. The process from preparation through initiated follow-through, contributor roles, and scenarios remain evidence-backed because no observed meeting episode has yet validated the complete flow. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label answers as direct experience, observed practice, or informed hypothesis.\n- Focus on consequential client interactions, not routine scheduling, hosting, note taking, or one meeting technology.\n- Keep enduring relationship stewardship, opportunity stewardship, and detailed action execution in their separate interviews.\n- Preserve differences among decision-forming, relationship-sensitive, and major cross-JPM meetings.\n- Proxy responses establish candidate direction only. They do not reconfirm banker intent.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. The primary progress and threshold for a consequential meeting.\n2. A minimum readiness, hypothesis, posture, and uncertainty contract.\n3. In-meeting adaptation and changed-state interpretation rules.\n4. Completion, commitment, handoff, and contributor boundaries.\n5. Scenario variations, measures, guardrails, and episode evidence.\n6. A short current-banker validation set.\n\n## CMEET01 - Primary Progress\n\n**Question:** What should a consequential client meeting enable a Senior Coverage MD and JPM team to create or protect?\n\n**Response mode:** Select and rank up to three primary outcomes; classify other selected items as enablers or downstream benefits.\n\n**Possible answers:**\n\n- Learn material client intent.\n- Improve trust, candor, or relationship quality.\n- Influence or protect a forming client decision.\n- Advance a relationship or opportunity outcome.\n- Align JPM around one coherent client posture.\n- Make a consequential commitment explicit.\n- Validate deliberate non-action or deferral.\n- Recognize that a prepared hypothesis is wrong.\n- Another outcome.\n\n## CMEET02 - Consequential Meeting Threshold\n\n**Question:** What makes a client interaction worthy of a distinct consequential-meeting process and Senior Coverage MD attention?\n\n**Response mode:** Select and rank the strongest tests; distinguish required from sufficient conditions.\n\n**Possible answers:**\n\n- Relationship leverage where MD presence can alter the result.\n- A forming or time-sensitive client decision.\n- Material relationship risk or repair need.\n- A major client or JPM commitment.\n- Cross-JPM orchestration or conflicting positions.\n- Protocol, seniority, or right-to-engage requirements.\n- Strategic ambiguity that requires contextual senior judgment.\n- A fixed window to learn or influence.\n- Another threshold.\n\n## CMEET03 - Minimum Readiness\n\n**Question:** What must be understood before entering a consequential client interaction?\n\n**Response mode:** Select the minimum readiness elements and identify what may remain on demand.\n\n**Possible answers:**\n\n- Why the moment matters now.\n- Relevant client, relationship, and stakeholder context.\n- Current opportunity, commitment, and prior-interaction state.\n- A grounded client hypothesis.\n- Intended learning, influence, protection, repair, or decision outcome.\n- Material evidence and uncertainty.\n- JPM posture, participants, and roles.\n- Sensitivities, controls, and what must be avoided.\n- Likely client questions or objections.\n- Another readiness element.\n\n## CMEET04 - Hypothesis And Intended Outcome\n\n**Question:** How should the meeting hypothesis and intended outcome be framed so preparation remains useful without scripting the interaction?\n\n**Response mode:** Choose the governing model and identify who challenges or accepts it.\n\n**Possible answers:**\n\n- One primary hypothesis with explicit evidence and uncertainty.\n- Several plausible hypotheses ranked by consequence.\n- A learning objective where influence would be premature.\n- A specific decision or commitment objective.\n- A relationship objective such as trust, access, or repair.\n- An opportunity objective such as qualification or next client movement.\n- A deliberate non-action or deferral test.\n- Adaptive by meeting type and client context.\n- Another model.\n\n## CMEET05 - JPM Posture And Participants\n\n**Question:** How should JPM align message, questions, participants, and decision rights before the meeting?\n\n**Response mode:** Select the minimum alignment contract and identify who resolves disagreement.\n\n**Possible answers:**\n\n- One accepted meeting purpose and intended client outcome.\n- Named lead and participant roles.\n- Agreed facts, hypotheses, and areas of uncertainty.\n- Clear division between listening, advising, and asking.\n- Consistent JPM position where consistency is required.\n- Explicit areas where product or regional views may differ.\n- Decision rights for commitments made in the room.\n- Protocol, sequencing, and escalation for sensitive issues.\n- Another element.\n\n## CMEET06 - Critical Uncertainty And Controls\n\n**Question:** Which unresolved issues should cause the team to proceed, narrow the purpose, change participants, or defer the interaction?\n\n**Response mode:** Classify each issue as acceptable uncertainty, must-resolve, or stop condition.\n\n**Possible answers:**\n\n- Unverified fact that could materially change advice.\n- Unclear client decision-maker or authority.\n- Conflicting JPM positions.\n- Relationship or protocol sensitivity.\n- Restricted, wall-cross, legal, or conduct issue.\n- Unknown commitment authority.\n- Unclear purpose or no credible right to engage.\n- Missing evidence that can instead be handled as a client question.\n- Another issue.\n\n## CMEET07 - In-Meeting Adaptation\n\n**Question:** What should the Senior Coverage MD and team be prepared to notice and adapt to during the interaction?\n\n**Response mode:** Select the consequential signals and define who may change posture or make commitments.\n\n**Possible answers:**\n\n- New or contradicted client intent.\n- Changes in candor, trust, or relationship risk.\n- A forming decision or altered decision window.\n- New stakeholder influence or resistance.\n- Evidence that invalidates the prepared hypothesis.\n- Opportunity, timing, or competitive change.\n- A new commitment, dependency, or blocker.\n- Need to listen rather than advocate.\n- Need to stop, defer, or narrow the discussion.\n- Another signal.\n\n## CMEET08 - Interpreting The Changed State\n\n**Question:** What must be agreed after the meeting about what actually changed?\n\n**Response mode:** Select the required interpretations and identify who accepts the final changed state.\n\n**Possible answers:**\n\n- What was learned about client intent.\n- Whether trust, candor, or access changed.\n- Whether a decision advanced, was protected, or was deferred.\n- Whether the relationship objective changed.\n- Whether an opportunity judgment or trajectory changed.\n- What remains uncertain or disputed among JPM participants.\n- Whether action, monitoring, waiting, or stopping is appropriate.\n- What may be shared and with whom.\n- Another changed-state element.\n\n## CMEET09 - Completion And Follow-Through\n\n**Question:** What must happen before the meeting job is complete rather than merely finished on the calendar?\n\n**Response mode:** Select the minimum completion contract and identify destination owners.\n\n**Possible answers:**\n\n- Interpret and accept the outcome.\n- Make explicit commitments and non-commitments.\n- Name accountable owners and first next movements.\n- Update the relationship judgment.\n- Update the opportunity or pipeline state.\n- Route new intelligence for validation or monitoring.\n- Create or update actions and dependencies.\n- Record deliberate non-action and return conditions.\n- Begin the first material follow-through step.\n- Another completion condition.\n\n## CMEET10 - Scenario Variation\n\n**Question:** Which meeting contexts materially change preparation, participation, or follow-through while preserving the same core job?\n\n**Response mode:** Select material variations and explain what remains invariant.\n\n**Possible answers:**\n\n- Client decision is forming.\n- Relationship-sensitive listening or repair.\n- Major commitment or negotiation.\n- Cross-JPM or multi-product meeting.\n- First senior interaction with a stakeholder.\n- Crisis, adverse event, or reputation-sensitive meeting.\n- Routine strategic review with no acute trigger.\n- Virtual, in-person, travel, or short-notice interaction.\n- Another scenario.\n\n## CMEET11 - Success And Failure\n\n**Question:** What would prove consequential-meeting work is improving client and franchise outcomes, and what must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails.\n\n**Possible success measures:**\n\n- Better readiness and less last-minute reconstruction.\n- Clearer client intent after the interaction.\n- Improved trust, candor, or access.\n- Decisions advanced or protected.\n- Explicit commitments and reliable ownership.\n- Faster first next movement.\n- Appropriate deliberate non-action.\n\n**Possible failure modes:**\n\n- Generic preparation without a hypothesis.\n- Over-scripted interaction that prevents listening.\n- Fragmented JPM posture.\n- Unsupported or unauthorized commitments.\n- Notes captured without interpretation.\n- Unowned follow-through.\n- Activity mistaken for client progress.\n\n## CMEET12 - Representative Episode\n\n**Question:** Walk through one consequential client meeting from trigger through first follow-through. Where did preparation, in-room adaptation, interpretation, or ownership materially affect the result?\n\n**Response mode:** Prefer a direct experience and label the meeting type and client context.\n\n**Probes:**\n\n- Why did the meeting warrant senior attention?\n- What hypothesis and intended outcome existed beforehand?\n- Which uncertainty or alignment issue mattered most?\n- What changed during the interaction?\n- How were differing interpretations reconciled?\n- Which commitment and first next movement followed?\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, synthesize the consequential threshold, readiness and posture contracts, adaptation and changed-state rules, completion and handoff boundary, scenario variations, measures, disagreements, and episode evidence. Current bankers should receive no more than five focused validation questions, including one observed meeting walkthrough and any disputed commitment-authority or completion rule.\nz\n"}, {"id": "act", "short": "Actions job family", "title": "Coverage Actions And Commitments", "code": "INT-COV-ACT-001", "file": "coverage-actions-and-commitments-proxy-interview.md", "qprefix": "CACT", "blurb": "Tests the working Actions hypothesis: embedded or standing, the ownership contract, the senior-attention boundary and measures.", "cohort": "Coverage \u00b7 ACT (hypothesis)", "md": "# Coverage Actions And Commitments - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-ACT-001` |\n| **Question range** | CACT01-CACT12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and business-management, execution, workflow, and team-leadership SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Test the working Actions and Commitments hypothesis, its embedded-versus-standing architecture, ownership contract, senior-attention boundary, and success measures. |\n| **Existing foundation** | Q122 accepted a useful working hypothesis, not a confirmed JTBD. Current evidence says consequential work needs an accepted owner, explicit next commitment, visible outcome progress, and a cross-domain view of MD blockers. This interview must remain more exploratory than the four confirmed job families. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label answers as direct experience, observed practice, or informed hypothesis.\n- Actively test whether Actions deserves a distinct standing job, an execution layer beneath other job families, both, or only an exception view.\n- Keep the focus on consequential commitments and outcome progress, not generic task management or personal productivity.\n- Do not assume a named assignee has accepted ownership.\n- Proxy responses establish candidate direction only. Actions remains unconfirmed until broader banker validation.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. A candidate primary job and managed-object model.\n2. Entry and exit thresholds for consequential commitments.\n3. A minimum commitment, ownership, delegation, and escalation contract.\n4. A tested embedded-versus-standing architecture.\n5. Priority, dependency, automation, and control rules.\n6. Measures, failure modes, episode evidence, and focused banker questions.\n\n## CACT01 - Primary Progress\n\n**Question:** What should excellent management of actions and commitments enable a Senior Coverage MD and team to do more reliably?\n\n**Response mode:** Select and rank up to three primary outcomes; classify the remainder as enablers or downstream benefits.\n\n**Possible answers:**\n\n- Translate intent into accepted ownership and explicit next commitment.\n- Preserve strategic intent through delegation.\n- Keep commitments connected to visible client or franchise progress.\n- Reveal where MD judgment or action is blocking movement.\n- Resolve dependencies before consequences compound.\n- Enable owners to move without repeated reinterpretation.\n- Fulfil or consciously renegotiate consequential promises.\n- Stop low-value work sooner.\n- Release senior attention at the right point.\n- Another outcome.\n\n## CACT02 - What Is Being Managed\n\n**Question:** What is the primary object of the Actions job family, and which elements are supporting context rather than separate records?\n\n**Response mode:** Choose the closest model and explain how the elements relate.\n\n**Possible answers:**\n\n- Tasks.\n- Commitments made by JPM, clients, or partners.\n- Decisions waiting for authority or judgment.\n- Blockers and dependencies.\n- Outcomes in motion.\n- Senior-attention obligations.\n- A combined system with one dominant center.\n- No separate object; Actions is only execution metadata beneath other job families.\n- Another model.\n\n## CACT03 - Entry Threshold\n\n**Question:** Which work deserves entry into a standing senior Actions view rather than remaining in team-managed execution?\n\n**Response mode:** Select and rank the strongest tests; define any exception-only model.\n\n**Possible answers:**\n\n- Client or JPM promise with material consequence.\n- Decision only the MD or another senior authority can make.\n- Work awaiting MD feedback or relationship judgment.\n- Material blocker or dependency.\n- Shrinking decision or intervention window.\n- Relationship, opportunity, financial, or control consequence.\n- Commitment at risk of silent slippage.\n- Cross-domain work without one accepted owner.\n- Another threshold.\n\n## CACT04 - Minimum Commitment Contract\n\n**Question:** What must be explicit before consequential work can be treated as a real commitment rather than an informal intention?\n\n**Response mode:** Select the minimum contract and identify what may remain progressive detail.\n\n**Possible answers:**\n\n- Intended client or franchise outcome.\n- Accepted accountable owner.\n- Explicit next commitment or movement.\n- Why it matters and consequence of delay.\n- Decision rights and required authority.\n- Evidence, inputs, and relevant context.\n- Quality bar or evidence of completion.\n- Checkpoint, due condition, and escalation rule.\n- Dependencies and contributing owners.\n- Sensitivity and sharing constraints.\n- Another element.\n\n## CACT05 - Accepted Ownership\n\n**Question:** What proves that ownership is real rather than nominal, and how should ownership conflicts be resolved?\n\n**Response mode:** Select the acceptance signals and choose the conflict-resolution model.\n\n**Possible answers:**\n\n- Owner explicitly accepts the outcome and next commitment.\n- Owner has authority, capacity, and access to required inputs.\n- Owner can explain the quality bar and escalation rule.\n- Dependencies have named contributors.\n- Owner may renegotiate openly when assumptions change.\n- One accountable owner remains clear even when work is shared.\n- Relevant business head resolves cross-team ownership conflict.\n- Ownership changes explicitly rather than drifting silently.\n- Another rule.\n\n## CACT06 - Delegation And Quality\n\n**Question:** What must survive delegation so the team can move without repeatedly returning to the MD for interpretation?\n\n**Response mode:** Select the essential delegation context and identify the translation or quality-control role.\n\n**Possible answers:**\n\n- Intended outcome and why it matters.\n- Strategic hypothesis and client context.\n- Decision rights and limits.\n- Standing or tailored quality bar.\n- Required inputs and source evidence.\n- Checkpoint and escalation rule.\n- What may be decided independently.\n- Evidence that the work has created progress.\n- VP, project lead, or another role translating senior intent.\n- Another element.\n\n## CACT07 - Intervention And Escalation\n\n**Question:** What should trigger senior intervention before the final due date or expected outcome?\n\n**Response mode:** Select and rank the strongest triggers; distinguish notification from required action.\n\n**Possible answers:**\n\n- Committed checkpoint missed.\n- Client or outcome progress is absent.\n- Decision window is shrinking.\n- Core assumption or client context changed.\n- Material dependency remains unresolved.\n- Quality is diverging from the accepted bar.\n- Owner lacks authority, capacity, or access.\n- Relationship, financial, or control risk increased.\n- Conflicting actions or commitments emerged across job families.\n- Another trigger.\n\n## CACT08 - Resolution And Exit\n\n**Question:** When may a commitment leave the senior attention set, and what closure evidence is required?\n\n**Response mode:** Select all legitimate exit states and define the minimum rationale.\n\n**Possible answers:**\n\n- Intended client or franchise progress is evidenced.\n- Commitment is fulfilled.\n- Commitment is consciously renegotiated.\n- Credible owner and checkpoint allow senior attention to release.\n- Blocker or dependency is resolved.\n- Deliberate wait or monitor state is accepted.\n- Stop decision is made because expected value changed.\n- Work
