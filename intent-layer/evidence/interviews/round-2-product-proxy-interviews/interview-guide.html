<script>
const GUIDES = [{"id": "mv", "short": "Model validation", "title": "Coverage Intent Model Validation", "code": "INT-COV-MV-001", "file": "coverage-intent-model-validation-proxy-interview.md", "qprefix": "MV", "blurb": "Tests whether the four-lens Coverage model is the right summary of how Coverage works. Episode first, then try to break every statement.", "cohort": "Coverage", "md": "# Coverage Intent Model Validation - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-MV-001` |\n| **Question range** | MV00-MV11 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers (Line MD or Group Head level), former Coverage VPs who ran a senior's book, and product proxies with direct Coverage exposure |\n| **Focused validation audience** | At least two current Senior Coverage MDs who did not take part in Round 1, plus one product banker, after proxy synthesis |\n| **Purpose** | Test whether the existing four-lens Coverage intent model is the right summary of how Coverage operates and thinks, and whether it is framed around value, before current-banker time is spent. This guide validates what exists. It does not set new direction and does not produce new JTBDs. |\n| **Existing foundation** | Five JTBD statements (intelligence triage, client relationship management, opportunity pipeline stewardship, consequential client meetings, umbrella), one working hypothesis (actions and commitments), four business use cases with six steps each, fourteen scenarios, and two actor cohorts. All derived from one Senior Coverage MD, Q01 to Q151. Every statement in the pre-read pack is a hypothesis for this interview, whatever its catalogue maturity. |\n| **What this guide is not** | Not a discovery interview, not a market-intelligence direction interview, not a prototype review. If a respondent starts describing tools, bring them back to the work. |\n\n## Interviewer Guidance\n\n- Send the pre-read pack (Appendix A) at least 48 hours ahead. Ask respondents to mark it up before the session.\n- Ask MV00, the episode, first and in full before showing any statement. Do not let the model shape the story.\n- Ask respondents to label every answer as direct experience, observed practice, or informed hypothesis, and to say which year they were last active in the role.\n- Seek disconfirmation. For every statement ask what is wrong before asking what is right. \"Accurate as written\" is an acceptable answer only after the respondent has tried to break it.\n- Force ranking and single choices. Do not accept \"all of the above\". If a respondent cannot choose, record that as a finding about the list, not as an answer.\n- Do not defend or re-explain the model when it is challenged. Record the challenge verbatim.\n- Capture disagreement between respondents. Do not resolve it through facilitator inference.\n- Proxy responses can reject, edit or fail to break a statement. They cannot confirm it. Confirmation requires current bankers under the charter's two-participant rule.\n\n## Expected Validation Output\n\nThe proxy round should produce, for the Coverage model as it stands:\n\n1. A disposition for each of the five JTBD statements: survives unchallenged, needs edit (with the edit), wrong altitude, or not recognised.\n2. A verdict on each lens boundary, naming any pair that collides in practice.\n3. Any standing senior job the five lenses miss, with an example of that work.\n4. A verdict on the actions and commitments lens: standing lens, execution layer, both, or neither.\n5. Each lens's scenarios ranked by frequency and by consequence, plus missing scenarios and any scenario that is really a different use case.\n6. The actor split per lens: what is irreducibly MD work, what is team work, what is product-partner work.\n7. At least one concrete episode per respondent, mapped onto the model, with the points where the model fails to describe what happened.\n8. Observed current practice per lens, separate from desired practice.\n9. Value ranges in units for each of the four business outcomes.\n10. A language verdict: which words a banker would not use, with substitutions.\n11. No more than five focused questions for current bankers, including at least one episode request.\n\n## MV00 - The Episode First\n\n**Question:** Think of a recent consequential situation from your time in Coverage. A signal you acted on or missed, a relationship that needed senior attention, an opportunity that was lost, parked or won late, or a meeting that changed something. Walk me through it from the moment it first became visible to the point where it was resolved or went quiet.\n\n**Response mode:** Open narrative, ten to fifteen minutes, before any statement is shown. Interviewer records the timeline, the people, the artefacts and the decisions.\n\n**Probes:**\n\n- How did it first become visible, and to whom?\n- What did you rely on at each step: a tracker, email, a call, a meeting, memory, a system?\n- Who owned the next move at each step, and did they know they owned it?\n- Where did the chain break, slow down or recover?\n- What was the consequence for the client, the relationship, the franchise or the revenue?\n- What would have had to be visible earlier to change the outcome?\n- Was anything deliberately not done, and was that the right call?\n\n## MV01 - Map The Episode Onto The Model\n\n**Question:** Now look at the pre-read pack. Which of the five lenses did your episode pass through, in what order, and where does the model describe what happened well, poorly, or not at all?\n\n**Response mode:** Tag each lens touched (intelligence, relationships, pipeline, meetings, actions and commitments). For the lens where the episode spent most time, walk the six use-case steps and mark each as happened as described, happened differently, or did not happen.\n\n**Possible answers for each step:**\n\n- **Happened as described** - The step occurred in substance, whatever the tooling.\n- **Happened differently** - Describe the difference in who, what evidence, or what judgment.\n- **Did not happen** - And say whether its absence mattered.\n- **Happened but belongs to a different lens** - Say which.\n\n## MV02 - Test Each Job Statement\n\n**Question:** For each of the five job statements in the pre-read pack, try to break it. Then choose one disposition per statement.\n\n**Response mode:** One disposition per statement, with a reason. Where the disposition is an edit, give the edited wording.\n\n**Possible answers:**\n\n- **Survives** - You tried to break it and could not. Say what you tried.\n- **Right job, wrong wording** - Give the words you would change and why.\n- **Right wording, wrong altitude** - Too detailed, too abstract, or too system-shaped. Say which.\n- **Missing or wrong trade-off** - The \"without\" clause does not match what senior Coverage actually guards against.\n- **Not a job I recognise** - Senior Coverage does not do this as a distinct job. Say where the work actually sits.\n- **Two jobs in one** - Say where it splits.\n\n## MV03 - Lens Boundaries\n\n**Question:** The model keeps five lenses distinct and routes any situation that touches several to the accountable owner. In your experience, which pairs collide so often that the boundary is a fiction, and which boundary is drawn in the wrong place?\n\n**Response mode:** Rank up to two collisions. For each, say what work falls between the lenses today.\n\n**Possible answers:**\n\n- Intelligence and relationships: interpreting a signal and deciding to engage are one act.\n- Relationships and meetings: the enduring relationship job and the fixed-window meeting job are not separable.\n- Pipeline and actions: opportunity trajectory and follow-through are the same thing in practice.\n- Meetings and actions: the meeting is not over until follow-through is done, so they are one job.\n- Intelligence and pipeline: most signals are opportunity signals, so triage is pipeline work.\n- Umbrella and everything: the umbrella statement is where the real job lives and the lenses are artificial.\n- The boundaries hold.\n- Another collision.\n\n## MV04 - The Missing Job\n\n**Question:** Think about the senior Coverage work you did in a typical quarter. What did you spend material time on that none of the five lenses describes?\n\n**Response mode:** Name the work first, with an example. Then say whether it deserves a distinct job, is context inside a lens, or is a triggered guardrail.\n\n**Possible answers:**\n\n- Franchise and sector strategy: portfolio and competitive positioning.\n- People leadership: staffing, coaching, team health.\n- Risk and controls as standing work rather than triggered.\n- Internal stakeholder management beyond orchestrating the bank around a client.\n- Commercial performance: revenue, wallet, outlook beyond pipeline.\n- Capacity: allocating scarce team and specialist time.\n- Nothing material is missing.\n- Another job.\n\n## MV05 - Actions And Commitments\n\n**Question:** Every lens in the model hands its output to an \"actions and commitments\" lens that is only a working hypothesis. In practice, who owns follow-through once a senior has decided, and does that work deserve its own standing senior review?\n\n**Response mode:** Choose one architecture and name the real owner of follow-through in your experience.\n\n**Possible answers:**\n\n- **A standing lens** - Seniors review consequential commitments and blockers across all domains as a distinct job.\n- **An execution layer beneath each lens** - Follow-through belongs to whichever lens generated it; there is no separate senior job.\n- **Both** - Each lens owns its actions and a senior view exposes cross-domain commitments and blockers.\n- **An exception view only** - Follow-through surfaces to the senior only when impact, timing or blockage crosses a threshold.\n- **It should not exist as a lens** - The accountable owner's own lens is the destination; \"actions\" is a tooling idea, not a job.\n- Another model.\n\n## MV06 - Scenario Ranking\n\n**Question:** For each lens, rank its scenarios by how often they occurred in your experience and by how much was at stake when they did. Then name one scenario that is missing and one scenario that is really a different piece of work.\n\n**Response mode:** Two rankings per lens (frequency, consequence). One missing scenario per lens or \"none\". One misfiled scenario per lens or \"none\".\n\n**Scenarios to rank:**\n\n- Intelligence: short-window consequential signal (A), uncertain high-impact signal (B), deliberate non-action or monitoring (C).\n- Relationships: institution relationship review (A), time-sensitive risk or commitment (B), tier-based cadence review (C).\n- Pipeline: recurring pipeline session (A), material change or closing window (B), parked reactivation (C), ambiguous early idea (D), restricted cross-GIB opportunity (E).\n- Meetings: forming client decision (A), relationship-sensitive listening or repair (B), major commitment or cross-JPM meeting (C).\n\n**Probe:** Does any scenario produce something different from its parent use case's value delivered? If so it is a use case, not a scenario. Say which.\n\n## MV07 - The Actor Split\n\n**Question:** For each lens, what is irreducibly the MD's own work, what does the VP or team do, and what do product or regional partners do? The model leaves every contributor role marked as unvalidated.\n\n**Response mode:** Per lens, three short lists. Then answer the probe.\n\n**Possible MD-only work (choose the ones that are truly irreducible):**\n\n- Judging whether something matters in context.\n- Judging whether evidence is credible enough for the contemplated use.\n- Choosing the intended client outcome.\n- Deciding whether and how to use relationship capital.\n- Orchestrating the bank around the institution and resolving ownership.\n- Setting and enforcing the senior-ready bar.\n- Deciding to reshape, park or stop.\n- Deciding to do nothing.\n\n**Probe:** In your experience, which of these did a strong VP actually do without the MD, and did that work?\n\n## MV08 - How It Is Actually Done Today\n\n**Question:** Leaving aside how it should work, how was each lens's work actually done when you were last in the role? What held the state, who kept it current, and which parts of the model's six steps simply never happened?\n\n**Response mode:** Per lens, name the artefacts and the keeper. Label every answer observed practice or direct experience. Hypotheses are not accepted for this question.\n\n**Possible state holders:**\n\n- CRM or deal system of record.\n- Personal or team tracker (spreadsheet, document).\n- Email and calendar.\n- Meeting notes, where they existed.\n- Pitch and deal materials.\n- Junior banker memory.\n- MD memory.\n- Nowhere; it was reconstructed on demand.\n\n**Probes:** How much senior time went into reconstruction before a review? Which step in the model would have felt like administration rather than work?\n\n## MV09 - Value In Units\n\n**Question:** The model's four business outcomes have no baselines. From your experience, give a range for each of the following. A wide range is fine. A refusal to estimate is recorded as a finding.\n\n**Response mode:** Ranges with the experience label. One line each.\n\n**Measures:**\n\n- Senior hours per week spent reconstructing status, context or evidence rather than exercising judgment.\n- Consequential client or market events per quarter that reached you after the useful response window had passed.\n- Share of the reported pipeline you believed was stale or not credible at any given review.\n- Priority client institutions per year that went a quarter without purposeful senior contact.\n- Viable ideas per year that were never recognised as opportunities until a competitor or the client made them visible.\n- What one missed window cost, in whatever unit you would have used at the time: fee, mandate, relationship standing, or senior credibility.\n- Consequential meetings per quarter that produced no owned follow-through within a week.\n\n## MV10 - Language\n\n**Question:** Read the five job statements and one business use case aloud as if to a peer. Which words would a senior Coverage banker not use, and what would they say instead?\n\n**Response mode:** List each word or phrase and the substitute. Then rate the overall readability.\n\n**Candidate terms to test:** intelligence, disposition, destination lens, stewardship, evidential strength, purposeful next movement, accepted judgment, consequential, orchestrate, umbrella intent, value delivered.\n\n**Possible readability verdicts:**\n\n- A banker would read this and recognise their work.\n- A banker would recognise the work but not the words.\n- A banker would stop reading.\n\n## MV11 - The Model As A Litmus Test\n\n**Question:** This model is meant to be the test a product team must pass to show it adds value to Coverage. What would make it useless for that purpose, and how could a team claim alignment to it without actually adding value?\n\n**Response mode:** Open answer, then rank the strongest two failure modes.\n\n**Possible failure modes:**\n\n- Statements are broad enough that anything can claim to serve them.\n- No outcome has a number, so nothing can be shown to move.\n- The model describes desired progress, so a team can serve the aspiration while making the real work harder.\n- Non-action is a valid result, so a team can claim value from a product nobody uses.\n- The model reflects one MD, so a team can pick the parts that suit it.\n- The language is abstract enough that bankers will not challenge a claim made in it.\n- The missing actions lens lets any follow-through tooling claim alignment by default.\n- Another failure mode.\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, produce:\n\n- one disposition per JTBD statement, with every proposed edit preserved verbatim and attributed to the respondent's experience label;\n- the lens-boundary and missing-job findings, with examples;\n- the actions and commitments verdict;\n- scenario rankings by lens, missing scenarios, and any scenario proposed for promotion to a use case;\n- the actor split per lens;\n- every episode mapped onto the model, with the points where the model failed to describe it;\n- observed current practice per lens, kept separate from desired practice;\n- value ranges per outcome, with experience labels;\n- the language substitutions; and\n- no more than five focused questions for current bankers, including at least one episode request.\n\nCatalogue consequences. Any record a proxy rejected or materially edited is marked `Review required` under the generation guide's re-review procedure. No record is promoted on proxy evidence. The five JTBD statements remain evidence-backed, single participant until two current Senior Coverage MDs who did not draft them have been through the banker question set.\n\nCurrent bankers should be asked to break what the proxies could not, supply one episode each, and give value ranges. They should not be asked to repeat the full guide.\n\n## Appendix A - Pre-Read Pack\n\nSend this to respondents ahead of the session. Everything here is a hypothesis for the purposes of the interview.\n\n### The five job statements\n\n**Intelligence triage.** When new information may affect my clients or franchise, help me isolate consequential change, understand its client-specific implications and evidential strength, and choose the appropriate response and intended outcome, so we act early when it matters, confidently do nothing when it does not, and avoid surprises without consuming senior attention on noise.\n\n**Client relationship management.** When managing a priority client institution, help me judge and strengthen the quality of the relationship using meaningful markers of trust, access, reciprocity, and engagement, informed by what we understand of the client's evolving agenda, so JPM remains relevant, trusted, and positioned to influence and compete.\n\n**Opportunity pipeline stewardship.** When managing opportunities from idea through close, help me maintain disciplined stewardship through clear accountability, purposeful movement, regular challenge, and deliberate parking or exit, so the franchise can direct effort and protect its outlook without losing viable opportunities or creating administrative burden, even when client intent is ambiguous and judgments differ.\n\n**Consequential client meetings.** When a consequential client interaction creates a fixed window to learn or influence, help me enter with a grounded hypothesis, timely context, aligned JPM posture, and critical uncertainty resolved, so the meeting clarifies intent, strengthens trust, and advances, protects, or deliberately defers a decision, with the changed state carried into owned follow-through.\n\n**Umbrella.** When client and franchise conditions are changing, help me judge what is consequential in context and maintain momentum toward the outcomes that matter, so JPM responds coherently while there is still time to influence the result, without confusing activity with progress.\n\n**Working hypothesis, actions and commitments.** When consequential outcomes depend on coordinated work, help me translate intent into an accepted owner and explicit next commitment, and keep that commitment connected to visible outcome progress, so responsibilities resolve clearly and owners can move independently without work drifting or repeatedly returning to me.\n\n### The lens boundaries\n\n- Intelligence decides how consequential evidence should be interpreted and routed.\n- Relationships judge and strengthen institution-level relationship quality.\n- Pipeline governs disciplined opportunity stewardship from idea through close.\n- Actions and commitments translate intent into accepted ownership, explicit next commitments, and visible outcome progress.\n- Meetings prepare for and convert fixed client-interaction windows into interpreted, routed, and initiated progress.\n- Capacity is deferred. Risk and controls appear only when triggered.\n- When a situation touches several lenses, the accountable owner's lens leads and the others are linked.\n\n### The six steps of each business use case\n\n| Lens | Steps |\n| --- | --- |\n| Intelligence | Reduce noise; identify affected clients and context; explain consequence and evidence; judge the response; record the disposition; route to the destination lens. |\n| Relationships | Establish institution change and trajectory; interpret relationship markers; judge whether senior attention is warranted; set objective and stakeholder; choose the engagement disposition; review movement and update judgment. |\n| Pipeline | Recognise an opportunity or review trigger; assemble evidence and views; challenge maturity and trajectory; choose the stewardship response; confirm accountable stewardship and next movement; update the shared picture and review conditions. |\n| Meetings | Establish why this interaction matters now; form the hypothesis and intended outcome; align JPM posture and resolve critical uncertainty; engage and adapt; interpret the outcome; make commitments explicit, update lenses, initiate follow-through. |\n\n### The fourteen scenarios\n\nIntelligence A short-window signal, B uncertain high-impact signal, C deliberate non-action. Relationships A institution review, B time-sensitive risk or commitment, C tier-based cadence. Pipeline A recurring session, B material change or closing window, C parked reactivation, D ambiguous early idea, E restricted cross-GIB. Meetings A forming client decision, B listening or repair, C major commitment or cross-JPM.\n\n### The actor split as currently recorded\n\nSenior Coverage MD: judges materiality, credibility, response, intended client outcome, relationship quality, senior attention, pursuit, effort, reshape or stop. Coverage opportunity team: maintains evidence, stewards opportunities, executes next movement. All other contributor roles: unvalidated.\n"}, {"id": "mi", "short": "Coverage MI direction", "title": "Coverage Market Intelligence Direction", "code": "INT-COV-MI-001", "file": "coverage-market-intelligence-direction-proxy-interview.md", "qprefix": "MI", "blurb": "Sets the likely direction, boundaries and ownership model for market intelligence in senior Coverage.", "cohort": "Coverage", "md": "# Coverage Market Intelligence Direction - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-COV-MI-001` |\n| **Question range** | MI01-MI12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former senior Coverage bankers and market-intelligence SMEs |\n| **Focused validation audience** | Current Senior Coverage MDs after proxy synthesis |\n| **Purpose** | Establish the likely market-intelligence direction, boundaries, ownership model, and success tests without using current banker time for broad discovery. |\n| **Existing foundation** | The confirmed Coverage intelligence-triage JTBD establishes materiality, client implication, evidential strength, response, and intended outcome. This interview narrows that job to market intelligence and its operating model. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- Ask respondents to label each answer as direct experience, observed practice, or informed hypothesis.\n- Seek the strongest two or three choices rather than accepting every option.\n- Capture material disagreements; do not resolve them through facilitator inference.\n- Ask for examples where useful, but reserve detailed episode reconstruction and final wording for focused banker validation.\n- Proxy responses establish candidate direction only. They do not confirm banker intent.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. The primary progress market intelligence should create for Coverage.\n2. The banker decisions it should materially change.\n3. Initial market-domain and time-horizon boundaries.\n4. A minimum client-translation and evidence contract.\n5. A candidate production, ownership, and workflow-routing model.\n6. Two or three success measures plus unacceptable failure modes.\n7. A short list of disputed assumptions for current-bank validation.\n\n## MI01 - Primary Progress\n\n**Question:** What should excellent market intelligence enable a senior Coverage banker to do more reliably than today?\n\n**Response mode:** Select and rank up to three primary outcomes. Classify other selected items as enablers or downstream benefits.\n\n**Possible answers:**\n\n- **Anticipate client needs** - Recognize likely client concerns or decisions before they are explicitly stated.\n- **Improve client advice** - Bring timely, differentiated perspective rather than generic market commentary.\n- **Identify opportunities earlier** - Connect market change to plausible client needs or transaction paths.\n- **Challenge assumptions** - Test existing client, relationship, or opportunity judgments against changed conditions.\n- **Time engagement better** - Recognize when a useful client-intervention window opens or closes.\n- **Manage client or franchise risk** - Detect consequences that require protection, preparation, or deliberate non-action.\n- **Allocate senior attention** - Focus interpretation and engagement on the most consequential changes.\n- **Avoid consequential surprises** - Reduce late awareness of conditions the banker should have anticipated.\n- **Something else** - Describe the missing progress.\n\n## MI02 - Decisions Changed\n\n**Question:** Which banker decisions should market intelligence materially change rather than merely inform?\n\n**Response mode:** Select the consequential decisions and rank the three most important.\n\n**Possible answers:**\n\n- Who to engage.\n- When to engage.\n- What conversation thesis, question, or perspective to bring.\n- What advice or recommendation to give.\n- Whether an opportunity judgment has changed.\n- Whether transaction timing or readiness has changed.\n- Whether valuation, financing, or structure alternatives should be reconsidered.\n- Whether client or franchise risk requires action.\n- Where senior or team attention should move.\n- Whether deliberate monitoring or non-action is appropriate.\n- Another decision.\n\n## MI03 - Intelligence Scope\n\n**Question:** Which market-intelligence domains belong in the first scope for senior Coverage, and which should remain specialist context available on demand?\n\n**Response mode:** Rank up to five primary domains; mark the remainder as secondary, specialist-only, or out of scope.\n\n**Possible answers:**\n\n- Macro conditions and economic outlook.\n- Rates, credit, liquidity, and financing conditions.\n- Equity markets and sector performance.\n- Sector structure and operating trends.\n- Capital-markets issuance and transaction activity.\n- Investor sentiment, flows, and demand.\n- Valuation and comparable-company movement.\n- Competitor strategy and relevant peer actions.\n- Regulation, policy, and legal developments.\n- Geopolitical and country risk.\n- Client-specific market exposure or vulnerability.\n- Another domain.\n\n## MI04 - Relevant Time Horizons\n\n**Question:** At which time horizons does market intelligence create a distinct Coverage decision or client-engagement need?\n\n**Response mode:** Select each material horizon and state the distinct decision it supports.\n\n**Possible answers:**\n\n- **Intraday** - Immediate market dislocation or client-sensitive event.\n- **Days** - A near-term engagement, event, or decision window.\n- **Weeks** - Developing market thesis or client agenda implication.\n- **Quarter** - Planning, financing, strategic, or portfolio decisions.\n- **12-24 months** - Anticipated client needs and medium-term strategic positioning.\n- **Structural or multiyear** - Enduring sector, policy, technology, or business-model change.\n\n## MI05 - Materiality Test\n\n**Question:** What makes a market development consequential enough to surface to a senior Coverage banker?\n\n**Response mode:** Select and rank the strongest tests. Explain whether several tests must combine.\n\n**Possible answers:**\n\n- Material client exposure.\n- A closing or opening decision window.\n- Meaningful financial or valuation impact.\n- Strategic relevance to the client's agenda.\n- A relationship opportunity or threat.\n- A transaction, financing, or capital-allocation implication.\n- Significant deviation from prior expectations.\n- Consequence across several covered clients or the franchise.\n- Costly or irreversible delay.\n- Another materiality test.\n\n## MI06 - Client Translation\n\n**Question:** What must be added to a market fact before it becomes useful Coverage intelligence?\n\n**Response mode:** Select the minimum required elements; identify what may remain optional or progressive disclosure.\n\n**Possible answers:**\n\n- The affected client or client segment.\n- The client-specific implication.\n- Why the change matters now.\n- Evidence, provenance, freshness, and confidence.\n- Expected duration or decision window.\n- Comparable precedents or peer context.\n- JPM interpretation or differentiated perspective.\n- A potential conversation thesis or question.\n- Opportunity, relationship, or risk implication.\n- Recommended response, owner, or watch condition.\n- Another required element.\n\n## MI07 - Evidence And Trust\n\n**Question:** What evidence is sufficient for a banker to use market intelligence in judgment or a client conversation?\n\n**Response mode:** Define the minimum trust contract and where standards should rise with consequence.\n\n**Possible answers:**\n\n- Named and authoritative source.\n- Visible timestamp and freshness.\n- Provenance from source fact to interpretation.\n- Corroboration from independent evidence.\n- Clear distinction between fact, inference, and opinion.\n- Explicit confidence and known unknowns.\n- Methodology or assumptions where analysis is derived.\n- Dissenting or alternative interpretations.\n- Sensitivity and permissioning classification.\n- Named human owner or accountable reviewer.\n- Another trust requirement.\n\n## MI08 - Uncertainty\n\n**Question:** How should high-impact but uncertain market intelligence be handled?\n\n**Response mode:** Choose the closest governing model and note exceptions.\n\n**Possible answers:**\n\n- Elevate promptly as an explicit hypothesis.\n- Investigate or corroborate before surfacing.\n- Show directly with uncertainty and source limitations exposed.\n- Route first to the relevant market or sector SME.\n- Monitor for a defined corroboration condition.\n- Use as a question or scenario, not a recommendation.\n- Vary treatment according to impact, reversibility, and decision-window length.\n- Another model.\n\n## MI09 - Appropriate Synthesis\n\n**Question:** What should the banker receive instead of raw market content?\n\n**Response mode:** Select the essential outputs and identify which should be generated only on demand.\n\n**Possible answers:**\n\n- A concise material-change summary.\n- A client-impact view.\n- A market or sector thesis.\n- A scenario range with triggers.\n- A client-conversation brief.\n- An opportunity hypothesis.\n- A risk or watch condition.\n- A recommended action or deliberate non-action.\n- Links to the supporting evidence and dissenting views.\n- Another output.\n\n## MI10 - Ownership And Production\n\n**Question:** Who should turn market information into banker-ready intelligence, and who is accountable for its final interpretation?\n\n**Response mode:** Select the contributors, then identify one accountable role or an explicit stage-dependent ownership model.\n\n**Possible answers:**\n\n- Research analysts.\n- Markets or syndicate specialists.\n- Sector experts.\n- Product bankers.\n- Coverage team members.\n- A central market-intelligence function.\n- AI-assisted synthesis with named human review.\n- Shared production with a named accountable owner.\n- Ownership varies by domain or consequence.\n- Another model.\n\n## MI11 - Workflow Destination\n\n**Question:** Once market intelligence has been interpreted, where should it go so it changes work rather than becoming another feed?\n\n**Response mode:** Select all legitimate destinations and define the routing condition for each.\n\n**Possible answers:**\n\n- Client-institution or relationship plan.\n- Opportunity pipeline.\n- Meeting preparation.\n- Action or commitment.\n- Temporary cross-bank situation view.\n- Market or client watchlist.\n- Deliberate no-action or monitoring record.\n- Reusable institutional knowledge.\n- Specialist review queue.\n- Another destination.\n\n## MI12 - Success And Failure\n\n**Question:** What would prove the market-intelligence model is improving the business, and what failure must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails.\n\n**Possible success measures:**\n\n- Earlier relevant client engagement.\n- Better client conversations or advice.\n- Earlier recognition of opportunities or risks.\n- Faster evidence-to-decision movement.\n- Fewer consequential surprises.\n- Less banker time spent finding and reconciling information.\n- More appropriate deliberate non-action.\n- Improved commercial outcomes attributable to earlier or better judgment.\n\n**Possible failure modes:**\n\n- Excessive noise or alert fatigue.\n- Generic content without client relevance.\n- False confidence or unsupported recommendations.\n- Stale intelligence.\n- Duplicated analysis across teams.\n- Missed consequential signals.\n- Restricted-information leakage.\n- Activity without a changed decision or client outcome.\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, create a candidate direction containing:\n\n- top progress and decisions;\n- proposed scope and exclusions;\n- minimum client-translation and trust contracts;\n- candidate ownership and routing model;\n- selected measures and guardrails;\n- proxy disagreements and evidence gaps; and\n- no more than five focused questions for current bankers, including at least one concrete episode.\n"}, {"id": "cmi", "short": "Capital Markets MI direction", "title": "Capital Markets Market Intelligence Direction", "code": "INT-CM-MI-001", "file": "capital-markets-market-intelligence-direction-proxy-interview.md", "qprefix": "CMI", "blurb": "Establishes the shared Capital Markets market-intelligence job and the ECM/DCM variations before banker time is spent.", "cohort": "ECM / DCM", "md": "# Capital Markets Market Intelligence Direction - Proxy Interview\n\n## Interview Record\n\n| Field | Value |\n| --- | --- |\n| **Interview ID** | `INT-CM-MI-001` |\n| **Question range** | CMI01-CMI12 |\n| **Status** | `Draft` |\n| **Direction-setting audience** | Former ECM/DCM bankers, syndicate practitioners, and Capital Markets SMEs |\n| **Focused validation audience** | Current senior ECM and DCM bankers after proxy synthesis |\n| **Purpose** | Establish the shared Capital Markets market-intelligence job and the material ECM/DCM variations before using banker time on detailed thresholds, authority, and real episodes. |\n| **Existing foundation** | Current research suggests a shared issuer-specific market-window job. ECM emphasizes issuer readiness, valuation, shareholder context, equity supply, aftermarket performance, and investor demand. DCM emphasizes rates, curves, spreads, maturities, ratings, financing structure, comparable issuance, investor demand, and execution risk. These are hypotheses to test, not confirmed intent. |\n\n## Interviewer Guidance\n\n- Share all twelve questions in advance.\n- For every selected answer, tag it Common, ECM, DCM, or Desk-specific.\n- Ask respondents to distinguish direct experience, observed practice, and informed hypothesis.\n- Force prioritization: broad relevance does not make every item part of the primary job.\n- Preserve differences among ECM, investment-grade DCM, leveraged finance, and syndicate when they materially change the decision.\n- Proxy responses establish candidate direction only. They do not confirm current banker intent.\n\n## Expected Direction-Setting Output\n\nThe proxy round should produce:\n\n1. A candidate shared Capital Markets market-intelligence job.\n2. The key issuer and transaction decisions intelligence must change.\n3. A common intelligence core plus explicit ECM/DCM variations.\n4. Minimum issuer-translation, trust, and uncertainty contracts.\n5. A candidate production, authority, and workflow-routing model.\n6. Leading measures, lagging outcomes, and control guardrails.\n7. A focused current-banker validation plan split only where variations warrant it.\n\n## CMI01 - Primary Progress\n\n**Question:** What should excellent market intelligence enable a senior Capital Markets banker to do more reliably than today?\n\n**Response mode:** Select and rank up to three primary outcomes. Tag each Common, ECM, DCM, or Desk-specific.\n\n**Possible answers:**\n\n- **Detect actionable market windows** - Recognize when conditions support or constrain issuer action.\n- **Translate markets into issuer-specific advice** - Explain what changed, why it matters to this issuer, and what to consider next.\n- **Identify origination opportunities earlier** - Connect market change to capital needs, readiness, or transaction paths.\n- **Shape financing or equity strategy** - Compare product, structure, timing, and execution alternatives.\n- **Prepare differentiated client engagement** - Bring a clear thesis rather than generic market updates.\n- **Prioritize issuer attention** - Focus senior time where market change and issuer readiness intersect.\n- **Protect transaction execution** - Anticipate pricing, demand, supply, ratings, valuation, or timing risk.\n- **Avoid consequential market surprises** - Reduce late awareness of conditions that should have changed advice or execution.\n- **Something else** - Describe the missing progress.\n\n## CMI02 - Decisions Changed\n\n**Question:** Which Capital Markets decisions should market intelligence materially change rather than merely inform?\n\n**Response mode:** Select and rank the three most consequential; tag each by cohort.\n\n**Possible answers:**\n\n- Whether and when to approach an issuer.\n- Whether to recommend proceeding, accelerating, waiting, or stopping.\n- Which product, instrument, or transaction path to propose.\n- Size, tenor, maturity, tranche, or structural choices.\n- Valuation, pricing, spread, discount, or guidance range.\n- Investor targeting, positioning, allocation, or distribution strategy.\n- Launch timing and execution-window judgment.\n- Underwriting, balance-sheet, or execution-risk posture.\n- Which issuers or live transactions deserve senior attention.\n- Whether deliberate monitoring or non-action is appropriate.\n- Another decision.\n\n## CMI03 - Intelligence Scope\n\n**Question:** Which market-intelligence domains form the shared Capital Markets core, and which are ECM-, DCM-, or desk-specific?\n\n**Response mode:** Rank up to six primary domains and tag each by cohort.\n\n**Possible answers:**\n\n- Macro conditions and economic events.\n- Rates, benchmark curves, and funding conditions.\n- Credit spreads, curves, and liquidity.\n- Equity indices, sector performance, and equity risk appetite.\n- Volatility and market stability.\n- Valuation, comparable trading, and transaction precedents.\n- Issuance activity and competing supply.\n- Aftermarket performance and new-issue concessions.\n- Investor demand, flows, feedback, and positioning.\n- Ratings, capital structure, liquidity, and maturity profile.\n- Shareholder, sponsor, ownership, and corporate-action context.\n- Regulatory, policy, geopolitical, and country risk.\n- Another domain.\n\n## CMI04 - Relevant Time Horizons\n\n**Question:** At which horizons does market intelligence create a distinct Capital Markets decision?\n\n**Response mode:** Select each material horizon, identify the decision it supports, and tag cohort variation.\n\n**Possible answers:**\n\n- **Live or intraday** - Price movement, book dynamics, volatility, or execution risk.\n- **Next 24-72 hours** - Launch, pricing, investor engagement, or event response.\n- **One to four weeks** - Near-term issuance window, competing supply, or client preparation.\n- **Quarter or funding calendar** - Planned issuance, refinancing, readiness, or capital action.\n- **12-24 months** - Capital structure, maturity wall, IPO readiness, sponsor monetization, or strategic financing plan.\n- **Structural or multiyear** - Persistent market, regulatory, sector, capital, or investor-base change.\n\n## CMI05 - Materiality Test\n\n**Question:** What makes a market development consequential enough to surface to a senior Capital Markets banker?\n\n**Response mode:** Select and rank the strongest tests; state whether several tests must combine.\n\n**Possible answers:**\n\n- It changes an issuer's capital need or readiness.\n- It opens, narrows, or closes an execution window.\n- It materially changes pricing, spread, discount, or valuation support.\n- It changes execution probability or risk.\n- It changes investor appetite, distribution, or likely book quality.\n- It creates meaningful competing supply or peer pressure.\n- It changes ratings, liquidity, maturity, or capital-structure considerations.\n- It changes a client decision or creates a reason to engage now.\n- It affects several relevant issuers or a desk portfolio.\n- Delay would be costly or difficult to reverse.\n- Another materiality test.\n\n## CMI06 - Issuer Translation\n\n**Question:** What must be added to a market fact before it becomes useful Capital Markets intelligence for a specific issuer or transaction?\n\n**Response mode:** Select the minimum required elements and tag material ECM/DCM differences.\n\n**Possible answers:**\n\n- The affected issuer, sector, or transaction.\n- Why the development matters to that issuer now.\n- Issuer readiness, capital need, maturity, ownership, or strategic context.\n- Product, structure, or transaction alternatives implicated.\n- Evidence, provenance, freshness, and confidence.\n- Expected window duration and relevant triggers.\n- Comparable issuance, trading, pricing, valuation, or aftermarket evidence.\n- Investor-demand or syndicate interpretation.\n- A client conversation thesis and likely questions or objections.\n- Recommended response, owner, or watch condition.\n- Another required element.\n\n## CMI07 - Evidence And Trust\n\n**Question:** What evidence is sufficient for a banker to use market intelligence in client advice, pricing, or execution judgment?\n\n**Response mode:** Define the minimum trust contract and where standards rise with consequence.\n\n**Possible answers:**\n\n- Named authoritative source and visible timestamp.\n- Clear mapping from market evidence to the issuer or transaction.\n- Provenance from source fact to interpretation or recommendation.\n- Methodology, assumptions, and comparable-set definition.\n- Freshness appropriate to the decision window.\n- Explicit confidence and known unknowns.\n- Clear distinction between fact, model output, desk color, and judgment.\n- Alternative interpretations or dissenting market views.\n- Named human owner or accountable reviewer.\n- Sensitivity, wall-cross, entitlement, and permitted-use classification.\n- Another trust requirement.\n\n## CMI08 - Uncertainty And Scenarios\n\n**Question:** How should consequential but uncertain market intelligence be handled in origination, client advice, or execution?\n\n**Response mode:** Choose the governing model and identify where ECM/DCM or lifecycle stage changes it.\n\n**Possible answers:**\n\n- Present a range of scenarios with explicit triggers.\n- Surface as a hypothesis with confidence and evidence gaps.\n- Corroborate before using in client advice.\n- Route to syndicate, research, trading, ratings, or another SME first.\n- Use as a client question rather than a recommendation.\n- Monitor for a defined confirmation or invalidation condition.\n- Vary treatment by impact, reversibility, and remaining execution window.\n- Another model.\n\n## CMI09 - Appropriate Synthesis\n\n**Question:** What should a Capital Markets banker receive instead of raw feeds, market color, and transaction data?\n\n**Response mode:** Select the essential outputs and tag each by cohort or lifecycle stage.\n\n**Possible answers:**\n\n- A concise market-window verdict with confidence and horizon.\n- An issuer-readiness or financing-needs assessment.\n- A pricing, spread, discount, or valuation range with assumptions.\n- Relevant comparable issuance, trading, or aftermarket evidence.\n- Competing-supply and investor-demand interpretation.\n- Scenarios, triggers, and execution risks.\n- A client-ready thesis, talking points, and likely objections.\n- An opportunity hypothesis or recommended next action.\n- A watch condition or deliberate wait rationale.\n- Links to supporting evidence, provenance, and dissenting views.\n- Another output.\n\n## CMI10 - Ownership And Production\n\n**Question:** Who should produce banker-ready Capital Markets intelligence, and who is accountable for its final interpretation or recommendation?\n\n**Response mode:** Select contributors, identify one accountable owner or stage-dependent authority, and tag cohort differences.\n\n**Possible answers:**\n\n- Research analysts.\n- Syndicate or capital-markets desk specialists.\n- Markets, sales, or trading contributors.\n- Sector or industry bankers.\n- ECM or DCM product bankers.\n- Coverage bankers.\n- Ratings, structuring, valuation, or other specialist teams.\n- A central market-intelligence function.\n- AI-assisted synthesis with named human review.\n- Shared production with one accountable banker.\n- Authority changes from origination to live execution.\n- Another model.\n\n## CMI11 - Workflow Destination\n\n**Question:** Once interpreted, where should market intelligence go so it changes issuer advice or transaction work rather than becoming another dashboard?\n\n**Response mode:** Select all legitimate destinations and define the routing condition for each.\n\n**Possible answers:**\n\n- Issuer or relationship plan.\n- Origination idea or opportunity pipeline.\n- Market update or issuer briefing.\n- Pitch preparation.\n- Client-meeting preparation.\n- Live transaction or mandate workspace.\n- Pricing, valuation, structuring, or scenario workbench.\n- Action, approval, or escalation.\n- Issuer, market, ratings, supply, or investor-demand watchlist.\n- Deliberate no-action or wait record.\n- Reusable precedent and post-deal knowledge.\n- Another destination.\n\n## CMI12 - Success And Failure\n\n**Question:** What would prove Capital Markets intelligence is improving the business, and what failure must it avoid?\n\n**Response mode:** Select one or two leading measures, one or two lagging outcomes, and the most important guardrails. Tag cohort variation.\n\n**Possible success measures:**\n\n- Earlier issuer engagement around a relevant market window.\n- Better issuer-specific advice and client conversations.\n- Earlier or higher-quality origination opportunities.\n- Better timing, structure, pricing, valuation, or execution decisions.\n- Improved mandate conversion or competitive positioning.\n- Fewer avoidable market or execution surprises.\n- Less banker time spent finding, reconciling, and repackaging information.\n- Better capture and reuse of investor feedback and transaction outcomes.\n- More appropriate recommendations to wait or take no action.\n\n**Possible failure modes:**\n\n- Excessive noise or undifferentiated alerts.\n- Generic market commentary without issuer relevance.\n- Stale data or hidden assumptions.\n- False precision or unsupported timing, pricing, or valuation recommendations.\n- Incorrect issuer or transaction mapping.\n- Conflicting analysis across desks without accountable resolution.\n- Leakage of restricted, wall-cross, client-sensitive, or internal desk information.\n- Activity and dashboard consumption without a changed decision or client outcome.\n\n## Proxy Synthesis And Banker Validation Gate\n\nAfter proxy interviews, produce:\n\n- the proposed shared Capital Markets job;\n- common versus ECM/DCM/desk-specific decision and information needs;\n- proposed scope and exclusions;\n- minimum issuer-translation, trust, and uncertainty contracts;\n- candidate ownership and workflow-routing model;\n- selected measures and guardrails;\n- proxy disagreements and evidence gaps; and\n- separate focused banker-validation sets only where material cohort differences remain.\n\nCurrent bankers should be asked to correct the candidate model, supply concrete episodes, define consequential thresholds and authority, and validate final job wording. They should not be asked to repeat the full directional questionnaire unless proxy findings prove unreliable.\n"}];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){ // minimal markdown inline: bold, code
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
}
function parse(md){
  const lines = md.split('\n');
  const out = {title:'', record:[], sections:[], questions:[], gate:null, pack:null};
  let cur=null, mode='pre';
  const push=()=>{};
  for (let i=0;i<lines.length;i++){
    const L=lines[i];
    if (L.startsWith('# ')) { out.title=L.slice(2).trim(); continue; }
    if (L.startsWith('## ')) {
      const h=L.slice(3).trim();
      const qm=h.match(/^([A-Z]+\d\d) - (.+)$/);
      if (qm){ cur={n:qm[1],t:qm[2],body:[]}; out.questions.push(cur); mode='q'; continue; }
      if (/^Proxy Synthesis/i.test(h)){ cur={t:h,body:[]}; out.gate=cur; mode='s'; continue; }
      if (/^Appendix A/.test(h)){ cur={t:h,body:[]}; out.pack=cur; mode='s'; continue; }
      if (/^Interview Record/.test(h)){ cur={t:h,body:[]}; mode='rec'; continue; }
      cur={t:h,body:[]}; out.sections.push(cur); mode='s'; continue;
    }
    if (mode==='rec'){ const m=L.match(/^\|\s*\*\*(.+?)\*\*\s*\|\s*(.+?)\s*\|$/); if(m) out.record.push([m[1],m[2]]); continue; }
    if (cur) cur.body.push(L);
  }
  return out;
}
function renderBlocks(lines, opts={}){ // generic block renderer for sections/gate/pack
  let html='', list=null, table=null, para=[];
  const flushP=()=>{ if(para.length){ html+=`<p>${inline(para.join(' '))}</p>`; para=[]; } };
  const flushL=()=>{ if(list){ html+=`<${list.tag}>${list.items.map(x=>`<li>${inline(x)}</li>`).join('')}</${list.tag}>`; list=null; } };
  const flushT=()=>{ if(table){ const [h,...rows]=table.filter(r=>!/^\|\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim())); html+=`<div class="tablewrap"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; table=null; } };
  for (const L of lines){
    if (L.startsWith('### ')){ flushP();flushL();flushT(); html+=`<h3>${inline(L.slice(4))}</h3>`; continue; }
    if (L.startsWith('|')){ flushP();flushL(); (table=table||[]).push(L); continue; }
    const li=L.match(/^(\d+)\.\s+(.*)$/) || L.match(/^-\s+(.*)$/);
    if (li){ flushP();flushT(); const tag=/^\d/.test(L)?'ol':'ul'; if(!list||list.tag!==tag){flushL(); list={tag,items:[]};} list.items.push(li[2]!==undefined?li[2]:li[1]); continue; }
    if (!L.trim()){ flushP();flushL();flushT(); continue; }
    if (opts.pack && /^\*\*[^*]+\.\*\*/.test(L)){ flushP();flushL();flushT(); const m=L.match(/^\*\*(.+?)\*\*\s*(.*)$/); html+=`<div class="stmt"><strong>${esc(m[1])}</strong>${inline(m[2])}</div>`; continue; }
    flushL();flushT(); para.push(L);
  }
  flushP();flushL();flushT();
  return html;
}
function renderQuestion(g,q){
  let question='', mode='', rest=[], label=null, groups=[];
  for (const L of q.body){
    let m;
    if ((m=L.match(/^\*\*Question:\*\*\s*(.*)$/))){ question=m[1]; continue; }
    if ((m=L.match(/^\*\*Response mode:\*\*\s*(.*)$/))){ mode=m[1]; continue; }
    if ((m=L.match(/^\*\*([^*]+):\*\*\s*(.*)$/))){ label={t:m[1],lead:m[2],items:[]}; groups.push(label); continue; }
    if ((m=L.match(/^-\s+(.*)$/))){ if(!label){label={t:'',lead:'',items:[]};groups.push(label);} label.items.push(m[1]); continue; }
    if (L.startsWith('**') && label){ label.lead += ' '+L; continue; }
    if (L.trim() && label && !label.items.length){ label.lead += ' '+L; continue; }
    if (L.trim()) rest.push(L);
  }
  const key=`${g.id}:${q.n}`;
  const groupHtml=groups.map(gr=>{
    const isProbe=/probe/i.test(gr.t);
    const items=gr.items.map(it=>{ const mm=it.match(/^\*\*(.+?)\*\*\s*-\s*(.*)$/); return `<li>${mm?`<span><strong>${esc(mm[1])}</strong> <span style="color:var(--ink-2)">${inline(mm[2])}</span></span>`:`<span>${inline(it)}</span>`}</li>`; }).join('');
    return `${gr.t?`<div class="label">${esc(gr.t)}</div>`:''}${gr.lead.trim()?`<p class="mode">${inline(gr.lead.trim())}</p>`:''}${gr.items.length?(isProbe?`<ul class="probes">${gr.items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`:`<ul class="opts">${items}</ul>`):''}`;
  }).join('');
  return `<details class="q" id="${g.id}-${q.n}" data-key="${key}">
    <summary class="q-head"><span class="n">${q.n}</span><span class="t">${esc(q.t)}</span><span class="chev">⌄</span></summary>
    <div class="q-body">
      <p class="question">${inline(question)}</p>
      ${mode?`<div class="label">Response mode</div><p class="mode">${inline(mode)}</p>`:''}
      ${rest.length?`<p class="mode">${inline(rest.join(' '))}</p>`:''}
      ${groupHtml}
      <div class="note"><div class="label">Facilitator notes</div><textarea id="note-${g.id}-${q.n}" placeholder="Answers, experience label (direct / observed / hypothesis), disagreements…"></textarea></div>
      <label class="done-row"><input type="checkbox" id="done-${g.id}-${q.n}"> Asked and recorded</label>
    </div>
  </details>`;
}
function renderGuide(g){
  const d=parse(g.md);
  const rec=d.record.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${inline(v)}</dd></div>`).join('');
  const sections=d.sections.map(s=>`<section class="section"><h2>${esc(s.t)}</h2>${renderBlocks(s.body)}</section>`).join('');
  const qs=d.questions.map(q=>renderQuestion(g,q)).join('');
  const gate=d.gate?`<section class="gate"><h2>${esc(d.gate.t)}</h2>${renderBlocks(d.gate.body)}</section>`:'';
  const pack=d.pack?`<section class="pack"><h2>${esc(d.pack.t.replace(/^Appendix A - /,''))}</h2>${renderBlocks(d.pack.body,{pack:true})}</section>`:'';
  return `<article class="guide" data-guide="${g.id}">
    <div class="eyebrow"><span>${esc(g.code)}</span><span class="badge draft">Draft</span><span class="badge cohort">${esc(g.cohort)}</span><span>${d.questions.length} questions</span></div>
    <h1>${esc(d.title.replace(/ - Proxy Interview$/,''))}</h1>
    <p class="blurb">${esc(g.blurb)}</p>
    <dl class="record">${rec}</dl>
    ${sections}
    <div class="toolbar"><button class="btn" data-act="open">Expand all</button><button class="btn" data-act="close">Collapse all</button><span class="progress" id="prog-${g.id}"></span></div>
    ${qs}
    ${gate}
    ${pack}
  </article>`;
}
const tabs=document.getElementById('tabs'), main=document.getElementById('main'), qnav=document.getElementById('qnav');
let current = GUIDES[0].id;
try{ const h=location.hash.replace('#',''); if(GUIDES.some(g=>g.id===h)) current=h; else { const s=localStorage.getItem('r2.tab'); if(s&&GUIDES.some(g=>g.id===s)) current=s; } }catch(e){}
function store(k,v){ try{ localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function show(id){
  current=id; store('r2.tab',id);
  tabs.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id));
  const g=GUIDES.find(x=>x.id===id);
  main.innerHTML=renderGuide(g);
  const d=parse(g.md);
  qnav.innerHTML=`<h4>Questions</h4>`+d.questions.map(q=>`<a href="#${g.id}-${q.n}" data-q="${g.id}:${q.n}"><span class="n">${q.n}</span><span>${esc(q.t)}</span></a>`).join('');
  main.querySelectorAll('textarea').forEach(t=>{ const v=load('r2.note.'+t.id); if(v) t.value=v; t.addEventListener('input',()=>store('r2.note.'+t.id,t.value)); });
  main.querySelectorAll('input[type=checkbox]').forEach(c=>{ c.checked=load('r2.done.'+c.id)==='1'; c.addEventListener('change',()=>{store('r2.done.'+c.id,c.checked?'1':'0'); progress();}); });
  main.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>main.querySelectorAll('details.q').forEach(dd=>dd.open=b.dataset.act==='open')));
  qnav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{ const el=document.getElementById(a.getAttribute('href').slice(1)); if(el){ el.open=true; } }));
  const first=main.querySelector('details.q'); if(first) first.open=true;
  progress();
}
function progress(){
  const all=[...main.querySelectorAll('input[type=checkbox]')]; const done=all.filter(c=>c.checked).length;
  const p=document.getElementById('prog-'+current); if(p) p.textContent=`${done} of ${all.length} asked`;
  all.forEach(c=>{ const key=c.id.replace('done-','').replace(/-([A-Z]+\d\d)$/,':$1'); const a=qnav.querySelector(`a[data-q="${key}"]`); if(a) a.classList.toggle('done',c.checked); });
}
GUIDES.forEach(g=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.dataset.id=g.id; b.innerHTML=`<span>${esc(g.short)}</span><span class="code">${esc(g.code)}</span>`; b.addEventListener('click',()=>{ show(g.id); history.replaceState(null,'','#'+g.id); }); tabs.appendChild(b); });
show(current);
</script>
